function tog(i,k,v){const a=D.programm[i][k];const j=a.indexOf(v);
  j>=0?a.splice(j,1):a.push(v);markDirty();render()}
function mv(i,d){const j=i+d;if(j<0||j>=D.programm.length)return;
  if(progKey(D.programm[i])!==progKey(D.programm[j]))return;
  [D.programm[i],D.programm[j]]=[D.programm[j],D.programm[i]];markDirty();render()}

/* ---------------------------------------------------------------- Kalender */
/* Aufgebaut wie Google Kalender: Tag, Woche, Monat. Zwei Arten von Einträgen:
   Veranstaltungen aus dem Programm (kind 'p') und weitere Termine wie Deadlines
   oder Sitzungen (kind 'o', in D.termine). Themen (kind 't') lassen sich in den
   Kalender ziehen und landen so im Programm. Ohne Uhrzeit gilt ein Eintrag als ganztägig. */
const MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September',
  'Oktober','November','Dezember'];
const WT=['Mo','Di','Mi','Do','Fr','Sa','So'];
const FARBEN={blau:'#3b6788',grün:'#3f7356',ocker:'#9a6a1c',violett:'#6a4c86',rot:'#b3412f',grau:'#6b645e'};
const HOUR=48, SNAP=15;   /* Pixel pro Stunde, Raster in Minuten */
const monthOf = d => new Date(d.getFullYear(),d.getMonth(),1);
const addDays = (d,n) => new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const weekStart = d => addDays(d,-((d.getDay()+6)%7));
const parseDay = s => new Date(s+'T00:00');
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${
  String(d.getDate()).padStart(2,'0')}`;
const isoWeek = d => {const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  return Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7)};
const toMin = s => /^\d\d:\d\d/.test(s||'') ? +s.slice(0,2)*60 + +s.slice(3,5) : null;
const toHM = m => {m=Math.max(0,Math.min(1439,Math.round(m)));
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const snap = m => Math.round(m/SNAP)*SNAP;
const nowMin = () => {const d=new Date();return d.getHours()*60+d.getMinutes()};
/* Dauer in Minuten; ohne gültiges Ende eine Stunde */
const dur = o => {const s=toMin(o.zeit), e=toMin(o.ende); return s!==null&&e!==null&&e>s ? e-s : 60};
/* Mehrtägig: «bis» ist das letzte Datum; leer oder gleich «datum» heisst eintägig */
const lastDay = o => o.datum&&o.bis&&o.bis>o.datum ? o.bis : o.datum;
const multi = o => !!o.datum && lastDay(o)!==o.datum;
const covers = (o,ds) => !!o.datum && ds>=o.datum && ds<=lastDay(o);
const daySpan = o => o.datum ? Math.round((parseDay(lastDay(o))-parseDay(o.datum))/864e5) : 0;
const shiftDay = (ds,n) => isoDay(addDays(parseDay(ds),n));
const fmtDay = s => s ? parseDay(s).toLocaleDateString('de-CH',{day:'numeric',month:'short'}) : '';
/* Lesbarer Termin für Tabellen, z.B. «2026-11-03 09:00 – 2026-11-05 17:00» */
function whenText(o){
  if(!o.datum) return '';
  if(multi(o)) return o.datum+(o.zeit?' '+o.zeit:'')+' – '+o.bis+(o.zeit&&o.ende?' '+o.ende:'');
  return o.datum+(o.zeit?' '+o.zeit+(o.ende?'–'+o.ende:''):'');
}
const evColor = e => e.kind==='p' ? 'var(--accent)' : FARBEN[e.farbe]||FARBEN.blau;
const getEv = (kind,i) => kind==='p' ? D.programm[i] : kind==='o' ? D.termine[i] : null;
const byStart = (a,b) => (a.datum||'').localeCompare(b.datum||'') || daySpan(b)-daySpan(a) || (toMin(a.zeit)??-1)-(toMin(b.zeit)??-1) || dur(b)-dur(a);

let calView = (()=>{try{return localStorage.getItem('origen-cal-view')||'week'}catch(e){return 'week'}})();
let calDate = parseDay(isoDay(new Date())), calMini = monthOf(calDate), calScroll = null, evEdit = null;

function setCalDate(d){calDate=d;calMini=monthOf(d)}
function calGo(view,ds){
  if(view){calView=view;try{localStorage.setItem('origen-cal-view',view)}catch(e){}}
  if(ds) setCalDate(parseDay(ds));
  render();
}
function calShift(n){
  if(!n) setCalDate(parseDay(isoDay(new Date())));
  else if(calView==='month') setCalDate(new Date(calDate.getFullYear(),calDate.getMonth()+n,1));
  else setCalDate(addDays(calDate,n*(calView==='week'?7:1)));
  render();
}
function miniShift(n){calMini=new Date(calMini.getFullYear(),calMini.getMonth()+n,1);render()}
function showInCal(datum){setCalDate(parseDay(datum));go('kalender')}
function calEvents(){
  return [
    ...D.programm.map((p,i)=>({kind:'p',i,titel:p.thema,datum:p.datum,bis:p.bis||'',zeit:p.zeit,ende:p.ende,
      text:p.thema+' '+p.notiz+' '+p.personen.join(' ')})),
    ...D.termine.map((t,i)=>({kind:'o',i,titel:t.titel,datum:t.datum,bis:t.bis||'',zeit:t.zeit,ende:t.ende,
      farbe:t.farbe,text:t.titel+' '+(t.ort||'')+' '+t.notiz})),
  ].filter(e=>!f.q||norm(e.text).includes(f.q));
}
function calTitle(days){
  if(calView==='month') return MONATE[calDate.getMonth()]+' '+calDate.getFullYear();
  const a=days[0], b=days.at(-1);
  if(calView==='day') return a.toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(a.getMonth()===b.getMonth()) return MONATE[a.getMonth()]+' '+a.getFullYear();
  return MONATE[a.getMonth()].slice(0,3)+(a.getFullYear()!==b.getFullYear()?' '+a.getFullYear():'')+
    ' – '+MONATE[b.getMonth()].slice(0,3)+' '+b.getFullYear();
}

/* ds: der Tag, in dem der Chip steht; first: Titel zeigen (erster Tag oder Zeilenanfang) */
function evChip(e,dot,ds,first=true){
  const m=multi(e), isDot=dot&&e.zeit&&!m, last=ds&&ds===lastDay(e);
  const cls=(m&&ds&&ds>e.datum?' cl':'')+(m&&ds&&!last?' cr':'');
  const tip=esc(e.titel)+(m?` (${fmtDay(e.datum)} – ${fmtDay(lastDay(e))})`:'');
  return `<div class="ev ${e.kind}${isDot?' dot':''}${cls}" data-ev="${e.kind}:${e.i}"${ds?` data-day="${ds}"`:''}
  tabindex="0" role="button" style="--c:${evColor(e)}" title="${tip}">${
  !first?'&nbsp;':(isDot||(m&&ds===e.datum&&e.zeit))?`<span class="tm">${esc(e.zeit)}</span>`:''}${
  first?esc(e.titel)||'(ohne Titel)':''}${last&&e.kind!=='t'?'<span class="rzx" title="Ziehen, um über mehrere Tage zu verlängern"></span>':''}</div>`;
}
function evBlock(e,{col,n}){
  const s=toMin(e.zeit), d=dur(e);
  return `<div class="blk ${e.kind}${d<45?' short':''}" data-ev="${e.kind}:${e.i}" tabindex="0" role="button"
    title="${esc(e.titel)}, ${esc(e.zeit)} – ${toHM(s+d)}"
    style="--c:${evColor(e)};top:${s/60*HOUR+1}px;height:${Math.max(d/60*HOUR-3,16)}px;
      left:calc(${col*100/n}% + 2px);width:calc(${100/n}% - 6px)">
    <div class="bt">${esc(e.titel)||'(ohne Titel)'}</div><div class="bm">${esc(e.zeit)} – ${toHM(s+d)}</div>
    <div class="rz"></div></div>`;
}
/* Überlappende Termine teilen sich die Spaltenbreite, wie bei Google */
function layout(list){
  const out=new Map(); let group=[], ends=[], groupEnd=-1;
  const flush=()=>{group.forEach(g=>out.set(g.e,{col:g.col,n:ends.length}));group=[];ends=[];groupEnd=-1};
  list.forEach(e=>{
    const s=toMin(e.zeit), en=s+dur(e);
    if(group.length&&s>=groupEnd) flush();
    let col=ends.findIndex(x=>x<=s);
    if(col<0){col=ends.length;ends.push(en)} else ends[col]=en;
    group.push({e,col}); groupEnd=Math.max(groupEnd,en);
  });
  flush(); return out;
}
function rTimeGrid(days,evs){
  const today=isoDay(new Date());
  const on=d=>evs.filter(e=>covers(e,isoDay(d))).sort(byStart);
  return `<div class="tg" style="--n:${days.length}">
    <div class="tg-row tg-head"><div class="gut">${calView==='week'?'KW '+isoWeek(days[0]):''}</div>${
      days.map(d=>{const ds=isoDay(d);
      return `<div class="tg-dh${ds===today?' today':''}"><span class="dw">${WT[(d.getDay()+6)%7]}</span>
        <button class="dnum" onclick="calGo('day','${ds}')"
          aria-label="${d.toLocaleDateString('de-CH')} als Tag anzeigen">${d.getDate()}</button></div>`}).join('')}</div>
    <div class="tg-row tg-all"><div class="gut">ganztägig</div>${days.map(d=>
      `<div class="ad-cell" data-date="${isoDay(d)}" data-allday="">${
        on(d).filter(e=>!e.zeit||multi(e)).map(e=>evChip(e,false,isoDay(d),
          isoDay(d)===e.datum||d===days[0]||(d.getDay()+6)%7===0)).join('')}</div>`).join('')}</div>
    <div class="tg-scroll" id="tgScroll"><div class="tg-row" style="height:${24*HOUR}px">
      <div class="gut hours">${[...Array(24)].map((_,h)=>h?
        `<span style="top:${h*HOUR}px">${String(h).padStart(2,'0')}:00</span>`:'').join('')}</div>
      ${days.map(d=>{const ds=isoDay(d), list=on(d).filter(e=>e.zeit&&!multi(e)), lay=layout(list);
        return `<div class="tg-col${ds===today?' today':''}" data-col="${ds}">${
          list.map(e=>evBlock(e,lay.get(e))).join('')}${
          ds===today?`<div class="now" style="top:${nowMin()/60*HOUR}px"></div>`:''}</div>`}).join('')}
    </div></div></div>`;
}
function rMonth(evs){
  const y=calDate.getFullYear(), m=calDate.getMonth(), today=isoDay(new Date());
  const lead=(new Date(y,m,1).getDay()+6)%7, weeks=Math.ceil((lead+new Date(y,m+1,0).getDate())/7);
  const byDay={}; evs.filter(e=>e.datum).forEach(e=>{
    for(let n=0,span=Math.min(daySpan(e),400);n<=span;n++) (byDay[shiftDay(e.datum,n)]||=[]).push(e)});
  let h=WT.map(w=>`<div class="dow">${w}</div>`).join('');
  for(let k=0;k<weeks*7;k++){
    const d=new Date(y,m,1-lead+k), ds=isoDay(d), list=(byDay[ds]||[]).sort(byStart);
    const max=list.length>4?3:4;
    h+=`<div class="mday${d.getMonth()!==m?' out':''}${ds===today?' today':''}" data-date="${ds}" data-mday="">
      <button class="dn" onclick="calGo('day','${ds}')">${d.getDate()===1?
        '1. '+MONATE[d.getMonth()].slice(0,3):d.getDate()}</button>
      ${list.slice(0,max).map(e=>evChip(e,true,ds,ds===e.datum||k%7===0)).join('')}${list.length>max?
        `<button class="link more" onclick="calGo('day','${ds}')">+${list.length-max} weitere</button>`:''}</div>`;
  }
  return `<div class="mg">${h}</div>`;
}
function miniMonth(evs){
  const y=calMini.getFullYear(), m=calMini.getMonth(), lead=(new Date(y,m,1).getDay()+6)%7;
  const today=isoDay(new Date()), sel=isoDay(calDate), has=new Set(evs.filter(e=>e.datum).flatMap(e=>[...Array(Math.min(daySpan(e),400)+1)].map((_,n)=>shiftDay(e.datum,n))));
  const wk=new Set(calView==='week'?[...Array(7)].map((_,k)=>isoDay(addDays(weekStart(calDate),k))):[]);
  let g=WT.map(w=>`<span>${w[0]}</span>`).join('');
  for(let k=0;k<42;k++){const d=new Date(y,m,1-lead+k), ds=isoDay(d);
    g+=`<button class="${d.getMonth()!==m?'out ':''}${ds===today?'today ':ds===sel?'sel ':wk.has(ds)?'wk ':''}${
      has.has(ds)?'has':''}" onclick="calGo(null,'${ds}')" aria-label="${d.toLocaleDateString('de-CH')}">${
      d.getDate()}</button>`}
  return `<div class="mini"><div class="mini-h"><b>${MONATE[m]} ${y}</b><span>
    <button onclick="miniShift(-1)" aria-label="Vorheriger Monat">‹</button><button
      onclick="miniShift(1)" aria-label="Nächster Monat">›</button></span></div>
    <div class="mini-g">${g}</div></div>`;
}
function rKalender(){
  sortProgramm();
  const sc=$('tgScroll'); if(sc) calScroll=sc.scrollTop;
  const evs=calEvents();
  const days=calView==='day'?[calDate]:[...Array(7)].map((_,k)=>addDays(weekStart(calDate),k));
  const planned=new Set(D.programm.map(p=>p.thema));
  const themen=D.themen.filter(t=>!planned.has(t.thema)&&(!f.q||norm(t.thema).includes(f.q)));
  $('t-kalender').innerHTML=`<div class="gc-top">
      <button onclick="calShift(0)" title="Taste T">Heute</button>
      <button class="icon" onclick="calShift(-1)" aria-label="Zurück" title="Taste P">‹</button>
      <button class="icon" onclick="calShift(1)" aria-label="Weiter" title="Taste N">›</button>
      <h2>${calTitle(days)}</h2>
      <span class="seg">${[['day','Tag','D'],['week','Woche','W'],['month','Monat','M']].map(([v,l,k])=>
        `<button class="${calView===v?'on':''}" onclick="calGo('${v}')" title="Taste ${k}">${l}</button>`).join('')}</span>
    </div>
    <div class="gc-body">
      <aside class="gc-side">
        <button class="create" onclick="openEv('o',-1,{datum:isoDay(calDate)})" title="Taste C">+ Erstellen</button>
        ${miniMonth(evs)}
        <p class="lab">Ohne Termin</p>
        <div class="pool" data-pool="">${evs.filter(e=>!e.datum).map(e=>evChip(e)).join('')||
          '<span class="rt">Hierher ziehen, um das Datum zu entfernen.</span>'}</div>
        <p class="lab" style="margin-top:20px">Themen, noch nicht im Programm</p>
        <div class="pool themes">${themen.map(t=>evChip({kind:'t',i:D.themen.indexOf(t),titel:t.thema})).join('')||
          '<span class="rt">—</span>'}</div>
        <p class="note" style="margin:6px 0 0">In den Kalender ziehen, um es ins Programm aufzunehmen.</p>
        <div class="legend"><span class="ev" style="--c:var(--accent)">Programm</span>
          <span class="ev" style="--c:${FARBEN.blau}">Weiterer Termin</span><span class="ev t">Thema</span></div>
      </aside>
      <div class="gc-main">${calView==='month'?rMonth(evs):rTimeGrid(days,evs)}</div>
    </div>`;
  const s=$('tgScroll');
  if(s){
    s.scrollTop=calScroll??7*HOUR;
    const pad=s.offsetWidth-s.clientWidth+'px';   /* Spalten trotz Scrollbalken bündig */
    document.querySelectorAll('.tg-head,.tg-all').forEach(r=>r.style.paddingRight=pad);
  }
  bindCal();
}

/* --- Ziehen: verschieben, Länge ändern, neu aufziehen (Pointer Events, auch für Touch) --- */
let suppressClick=false;
function bindCal(){
  const root=$('t-kalender');
  root.querySelectorAll('[data-ev]').forEach(el=>{
    el.onpointerdown=e=>startDrag(e,el);
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();evClick(el.dataset.ev)}};
  });
  root.querySelectorAll('[data-col]').forEach(col=>col.onpointerdown=e=>{if(e.target===col)startCreate(e,col)});
  root.querySelectorAll('[data-allday],[data-mday]').forEach(c=>c.onclick=e=>{
    if(e.target===c&&!suppressClick) openEv('o',-1,{datum:c.dataset.date})});
}
function evClick(key){
  const [kind,i]=key.split(':');
  kind==='t'?goTopic(D.themen[+i].thema):openEv(kind,+i);
}
function dragListen(move,up,cancel){
  const off=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',u);
    removeEventListener('pointercancel',c)};
  const u=e=>{off();up(e)}, c=e=>{off();cancel(e)};
  addEventListener('pointermove',move);addEventListener('pointerup',u);addEventListener('pointercancel',c);
}
function endDragUI(){
  document.querySelectorAll('.ghost,.blk.preview').forEach(x=>x.remove());
  document.querySelectorAll('#t-kalender .over,#t-kalender .dragging')
    .forEach(x=>x.classList.remove('over','dragging'));
  document.body.classList.remove('cal-dragging');
  suppressClick=true;setTimeout(()=>suppressClick=false,0);
}
function autoScroll(e){
  const s=$('tgScroll'); if(!s) return; const r=s.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right) return;
  if(e.clientY<r.top+36) s.scrollTop-=14; else if(e.clientY>r.bottom-36) s.scrollTop+=14;
}
function previewBlock(col,s,d,titel,color){
  let p=document.querySelector('.blk.preview');
  if(!p){p=document.createElement('div');p.className='blk preview'}
  if(p.parentElement!==col) col.appendChild(p);
  p.style.cssText=`--c:${color};top:${s/60*HOUR+1}px;height:${Math.max(d/60*HOUR-3,16)}px;left:2px;right:6px`;
  p.classList.toggle('short',d<45);
  p.innerHTML=`<div class="bt">${esc(titel)||'(ohne Titel)'}</div><div class="bm">${toHM(s)} – ${toHM(s+d)}</div>`;
}
function dropTarget(x,y,kind,grab,d){
  const el=document.elementFromPoint(x,y); if(!el) return null;
  const col=el.closest('[data-col]');
  if(col){const r=col.getBoundingClientRect();
    return {type:'col',date:col.dataset.col,node:col,
      min:Math.max(0,Math.min(1440-d,snap((y-r.top)/HOUR*60-grab)))}}
  const cell=el.closest('[data-date]');
  if(cell) return {type:cell.dataset.allday!==undefined?'allday':'day',date:cell.dataset.date,node:cell};
  const pool=el.closest('[data-pool]');
  return pool&&kind!=='t' ? {type:'pool',node:pool} : null;
}
function startDrag(e,el){
  if(e.button!==0) return;
  e.preventDefault();
  const [kind,is]=el.dataset.ev.split(':'), i=+is, o=getEv(kind,i);
  const titel=o?(o.titel??o.thema):D.themen[i].thema;
  const color=kind==='t'?FARBEN.grau:evColor({kind,farbe:o.farbe});
  const resize=e.target.classList.contains('rz');
  const stretch=e.target.classList.contains('rzx')&&!!o;   /* über mehrere Tage ziehen */
  const d0=o&&toMin(o.zeit)!==null?dur(o):60;
  /* bei mehrtägigen Einträgen: an welchem Tag angefasst, damit der Balken nicht springt */
  const off=o&&el.dataset.day&&o.datum?Math.max(0,daySpan({datum:o.datum,bis:el.dataset.day})):0;
  let stretchTo=null;
  /* wo im Block angefasst wurde, damit er beim Ziehen nicht springt */
  const grab=el.classList.contains('blk')&&!resize?snap((e.clientY-el.getBoundingClientRect().top)/HOUR*60):0;
  const x0=e.clientX, y0=e.clientY;
  let moved=false, ghost=null, drop=null, newEnd=null;
  dragListen(ev=>{
    if(!moved){if(Math.hypot(ev.clientX-x0,ev.clientY-y0)<5) return;
      moved=true;document.body.classList.add('cal-dragging');if(!resize&&!stretch)el.classList.add('dragging')}
    autoScroll(ev);
    if(stretch){
      document.querySelectorAll('#t-kalender .over').forEach(x=>x.classList.remove('over'));
      const t=dropTarget(ev.clientX,ev.clientY,'t',0,d0);
      if(t?.date){stretchTo=t.date<o.datum?o.datum:t.date;t.node.classList.add('over')}
      if(!ghost){ghost=document.createElement('div');ghost.className='ev ghost';
        ghost.style.setProperty('--c',color);document.body.appendChild(ghost)}
      ghost.textContent=(titel||'(ohne Titel)')+(stretchTo?' · bis '+fmtDay(stretchTo):'');
      ghost.style.left=ev.clientX+10+'px';ghost.style.top=ev.clientY+8+'px';
      return;
    }
    if(resize){
      const r=el.parentElement.getBoundingClientRect(), s=toMin(o.zeit);
      newEnd=Math.max(s+SNAP,Math.min(1440,snap((ev.clientY-r.top)/HOUR*60)));
      previewBlock(el.parentElement,s,newEnd-s,titel,color);return;
    }
    document.querySelectorAll('#t-kalender .over').forEach(x=>x.classList.remove('over'));
    drop=dropTarget(ev.clientX,ev.clientY,kind,grab,d0);
    if(drop?.type==='col'){
      if(ghost) ghost.style.display='none';
      previewBlock(drop.node,drop.min,d0,titel,color);
    }else{
      document.querySelector('.blk.preview')?.remove();
      if(!ghost){ghost=document.createElement('div');ghost.className='ev ghost'+(kind==='t'?' t':'');
        ghost.style.setProperty('--c',color);ghost.textContent=titel||'(ohne Titel)';document.body.appendChild(ghost)}
      ghost.style.display='';ghost.style.left=ev.clientX+10+'px';ghost.style.top=ev.clientY+8+'px';
      drop?.node.classList.add('over');
    }
  },()=>{
    endDragUI();
    if(!moved){evClick(el.dataset.ev);return}
    if(resize){if(newEnd!==null){o.ende=toHM(newEnd);markDirty()}render();return}
    if(stretch){if(stretchTo){setBis(o,stretchTo);markDirty()}render();return}
    if(drop) applyDrop(kind,i,drop,d0,off); else render();
  },()=>{endDragUI();render()});
}
/* Enddatum setzen; aus einem mehrtägigen zeitlichen Termin wird bei Bedarf wieder ein eintägiger */
function setBis(o,ds){
  o.bis=ds&&ds>o.datum?ds:'';
  if(!o.bis&&o.zeit&&!(toMin(o.ende)>toMin(o.zeit))) o.ende=toHM(toMin(o.zeit)+60);
}
function applyDrop(kind,i,t,d,off=0){
  let o=getEv(kind,i);
  if(kind==='t'){addToProgramm(i);o=D.programm.at(-1)}
  const span=daySpan(o);
  if(t.type==='pool'){o.datum='';o.bis=''}
  else{
    o.datum=off?shiftDay(t.date,-off):t.date;
    o.bis=span?shiftDay(o.datum,span):'';
    if(t.type==='col'){o.zeit=toHM(t.min);o.ende=span?(o.ende||toHM(t.min+60)):toHM(t.min+d)}
    else if(t.type==='allday'){o.zeit='';o.ende=''}
  }
  markDirty();render();
}
/* Im leeren Raster klicken oder aufziehen legt einen neuen Termin an */
function startCreate(e,col){
  if(e.button!==0) return;
  const mouse=e.pointerType==='mouse'; if(mouse) e.preventDefault();
  const top=()=>col.getBoundingClientRect().top;
  const s0=Math.max(0,Math.min(1440-SNAP,Math.floor((e.clientY-top())/HOUR*60/SNAP)*SNAP));
  let a=s0, b=Math.min(1440,s0+60), moved=false; const y0=e.clientY;
  dragListen(ev=>{
    if(!mouse||(!moved&&Math.abs(ev.clientY-y0)<5)) return;
    moved=true;document.body.classList.add('cal-dragging');autoScroll(ev);
    const cur=Math.max(0,Math.min(1440,snap((ev.clientY-top())/HOUR*60)));
    a=Math.min(s0,cur);b=Math.max(s0+SNAP,cur);
    previewBlock(col,a,b-a,'',FARBEN.blau);
  },()=>{
    document.body.classList.remove('cal-dragging');
    previewBlock(col,a,b-a,'',FARBEN.blau);
    openEv('o',-1,{datum:col.dataset.col,zeit:toHM(a),ende:toHM(b)});
  },()=>document.querySelector('.blk.preview')?.remove());
}

/* ---------------------------------------------------------------- speichern */
let fileHandle=null, dirty=false, saveTimer=null, lastSave=null, saving=false, blocked=false;
const canWrite = typeof window.showSaveFilePicker === 'function';
const FILENAME = (location.pathname.split('/').pop()||'Origen-Programm-Mindmap.html')
                 .replace(/%20/g,' ') || 'Origen-Programm-Mindmap.html';

/* Die eigene Seite mit den aktuellen Daten neu zusammensetzen. */
function selfHTML(){
  sortProgramm();
  const json = JSON.stringify(D).replace(/</g,'\\u003c');
  return SELF.replace(/(<script id="seed" type="application\/json">)[\s\S]*?(<\/script>)/,
    (m,a,b)=>a+json+b);
}
function payload(name){
  sortProgramm();
  return /\.json$/i.test(name||'') ? JSON.stringify(D,null,1) : selfHTML();
}
function markDirty(){
  dirty=true; rev++;
  if(ghToken){clearTimeout(ghTimer);ghTimer=setTimeout(ghSave,2500)}
  else if(fileHandle){clearTimeout(saveTimer);saveTimer=setTimeout(writeFile,600)}
  updateStatus();
}
async function writeFile(){
  if(!fileHandle) return;
  try{
    saving=true;updateStatus();
    const w=await fileHandle.createWritable();
    await w.write(payload(fileHandle.name));
    await w.close();
    dirty=false;lastSave=new Date();
  }catch(e){
    saving=false;
    if(e.name==='NotAllowedError'){fileHandle=null;alert('Der Browser hat den Schreibzugriff '
      +'zurückgezogen. Bitte noch einmal «Speichern» und die Datei wählen.')}
    else alert('Speichern fehlgeschlagen: '+e.message);
  }
  saving=false;updateStatus();
}
async function saveFile(){
  if(ghToken){clearTimeout(ghTimer);await ghSave();return}
  if(fileHandle){await writeFile();return}
  if(canWrite&&!blocked){
    try{
      fileHandle=await window.showSaveFilePicker({suggestedName:FILENAME,
        types:[{description:'Webseite',accept:{'text/html':['.html']}},
               {description:'Nur Daten',accept:{'application/json':['.json']}}]});
      await writeFile();render();return;
    }catch(e){
      if(e.name==='AbortError') return;
      blocked=true;   /* z.B. wenn Chrome den Zugriff von file:// verweigert */
    }
  }
  downloadHTML();
}
function downloadHTML(){
  const b=new Blob([selfHTML()],{type:'text/html'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=FILENAME;a.click();
  dirty=false;lastSave=new Date();updateStatus();
  setTimeout(()=>alert('Die Datei liegt jetzt in deinen Downloads – ersetze damit die alte Datei '
    +'in deinem Ordner. (Safari und Firefox dürfen aus Sicherheitsgründen nicht direkt in eine '
    +'Datei schreiben; in Chrome geht das.)'),150);
}
function readData(txt){
  const m=txt.match(/<script id="seed" type="application\/json">([\s\S]*?)<\/script>/);
  return JSON.parse(m?m[1]:txt);
}
async function loadFile(){
  if(typeof window.showOpenFilePicker==='function'&&!blocked){
    try{
      const [h]=await window.showOpenFilePicker({types:[{description:'HTML oder JSON',
        accept:{'text/html':['.html'],'application/json':['.json']}}]});
      const loaded=readData(await (await h.getFile()).text());
      clearTimeout(saveTimer);D=loaded;
      fileHandle=h;dirty=false;lastSave=new Date();editing=null;draft=null;render();return;
    }catch(e){if(e.name==='AbortError')return; blocked=true}
  }
  $('imp').click();
}
function updateStatus(){
  const s=$('status'), b=$('linkbtn'); if(!s) return;
  const t=lastSave?lastSave.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}):'';
  const g=$('ghbtn'); if(g) g.textContent=ghToken?'Online ✓':'Online speichern …';
  if(ghToken){
    s.className='status'+(ghErr?' err':dirty?'':' online');
    s.textContent = ghErr?'nicht gespeichert':ghSaving?'speichert online …':dirty?'…':lastSave?'online gespeichert '+t:'online';
    s.title=ghErr||('Jede Änderung wird direkt in '+GH.owner+'/'+GH.repo+'/'+GH.path+' gespeichert');
    b.textContent='Speichern';return;
  }
  if(fileHandle){
    s.className='status';
    s.textContent = saving?'speichert …' : dirty?'…' : 'gespeichert '+t;
    s.title='Schreibt direkt in '+fileHandle.name;
  } else {
    s.className='status'+(dirty?' warn':'');
    s.textContent = dirty?'ungesichert':'';
    s.title='';
  }
  b.textContent='Speichern';
}
window.addEventListener('beforeunload',e=>{if(dirty){if(ghToken&&!ghSaving){clearTimeout(ghTimer);ghSave()}
  e.preventDefault();e.returnValue=''}});

/* ---------------------------------------------------------------- online speichern
   Die Seite schreibt sich über die GitHub-API selbst zurück ins Repository: jede Änderung
   wird nach kurzer Pause als Commit gespeichert. Dafür braucht es einmal pro Browser einen
   persönlichen Zugriffsschlüssel (Token), der nur in diesem Browser liegt. */
const GH = (()=>{
  const g={owner:'nik-96-ai',repo:'origen-mm-7k3q',branch:'main',path:'index.html'};
  const m=location.hostname.match(/^([^.]+)\.github\.io$/i);
  const parts=location.pathname.split('/').filter(Boolean).map(decodeURIComponent);
  if(m&&parts.length){
    g.owner=m[1]; g.repo=parts[0];
    const rest=parts.slice(1).join('/');
    g.path=/\.html?$/i.test(rest)?rest:(rest?rest+'/':'')+'index.html';
  }
  return g;
})();
const GH_KEY='origen-gh-token';
let ghToken=(()=>{try{return localStorage.getItem(GH_KEY)||''}catch(e){return ''}})();
let ghSha=null, ghBase=null, ghTimer=null, ghSaving=false, ghAgain=false, ghErr='', rev=0;
const ghURL = () => `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${
  GH.path.split('/').map(encodeURIComponent).join('/')}`;
function ghHeaders(tok=ghToken){
  return {'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
}
function b64encode(str){
  const bytes=new TextEncoder().encode(str); let bin='';
  for(let k=0;k<bytes.length;k+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(k,k+0x8000));
  return btoa(bin);
}
function b64decode(b64){
  const bin=atob(b64.replace(/\s/g,'')), bytes=new Uint8Array(bin.length);
  for(let k=0;k<bin.length;k++) bytes[k]=bin.charCodeAt(k);
  return new TextDecoder().decode(bytes);
}
/* neueste Fassung aus dem Repository: {sha, html} */
async function ghFetch(tok=ghToken){
  const r=await fetch(ghURL()+'?ref='+encodeURIComponent(GH.branch)+'&t='+Date.now(),
    {headers:ghHeaders(tok),cache:'no-store'});
  if(!r.ok){const e=new Error(r.status===401?'Token ungültig oder abgelaufen':
      r.status===403||r.status===404?'Kein Zugriff auf '+GH.owner+'/'+GH.repo+' (Token-Berechtigung prüfen)':
      'GitHub antwortet mit '+r.status);e.status=r.status;throw e}
  const j=await r.json();
  return {sha:j.sha, html:b64decode(j.content)};
}
/* Beim Öffnen die aktuellste Fassung holen – GitHub Pages braucht nach dem Speichern
   ein, zwei Minuten, bis die neue Datei ausgeliefert wird. */
function ghAdopt(remote){
  ghSha=remote.sha;
  if(/<script id="seed"/.test(remote.html)) SELF=remote.html;
  const data=readData(remote.html), js=JSON.stringify(data);
  ghBase=js;
  return {data,js};
}
async function ghSync(){
  if(!ghToken) return;
  try{
    const {data,js}=ghAdopt(await ghFetch());
    if(!dirty&&js!==JSON.stringify(D)){D=data;editing=null;draft=null;render()}
    ghErr='';
  }catch(e){ghErr=e.message}
  updateStatus();
}
async function ghSave(){
  if(!ghToken) return;
  if(ghSaving){ghAgain=true;return}
  ghSaving=true;ghAgain=false;updateStatus();
  const myRev=rev;
  try{
    if(!ghSha) ghAdopt(await ghFetch());
    for(let attempt=0;;attempt++){
      const html=selfHTML(), js=JSON.stringify(D);
      const r=await fetch(ghURL(),{method:'PUT',headers:ghHeaders(),body:JSON.stringify({
        message:'Änderungen aus dem Browser · '+new Date().toLocaleString('de-CH'),
        content:b64encode(html),sha:ghSha,branch:GH.branch})});
      if(r.ok){
        ghSha=(await r.json()).content.sha; SELF=html; ghBase=js; ghErr='';
        lastSave=new Date(); if(rev===myRev) dirty=false;
        break;
      }
      if((r.status===409||r.status===422)&&attempt<2){
        /* Datei wurde inzwischen anderswo gespeichert */
        const prevBase=ghBase, remote=await ghFetch(), {data,js:rjs}=ghAdopt(remote);
        if(rjs===prevBase||rjs===js) continue;      /* nur der Stand hat sich verschoben */
        if(confirm('Die Datei wurde inzwischen an anderer Stelle gespeichert (anderes Fenster oder '
          +'andere Person).\n\nOK: deine Fassung speichern und die andere überschreiben.\n'
          +'Abbrechen: deine letzten Änderungen verwerfen und die neuere Fassung laden.')) continue;
        D=data;dirty=false;editing=null;draft=null;render();break;
      }
      const e=new Error(r.status===401?'Token ungültig oder abgelaufen':
        r.status===403||r.status===404?'Token darf nicht in '+GH.repo+' schreiben':'GitHub antwortet mit '+r.status);
      throw e;
    }
  }catch(e){
    ghErr=e.message;
    if(/Token/.test(e.message)) alert('Online speichern fehlgeschlagen: '+e.message+
      '.\nÜber «Online ✓» oben kannst du einen neuen Token eintragen.');
  }
  ghSaving=false;updateStatus();
  if(ghAgain||(dirty&&rev!==myRev&&!ghErr)){clearTimeout(ghTimer);ghTimer=setTimeout(ghSave,800)}
}
function ghSetup(){
  const d=$('ghdlg');
  d.innerHTML=`<form onsubmit="event.preventDefault();ghConnect()">
    <h3 style="margin-bottom:10px">Online speichern</h3>
    <p style="font-size:13.5px;margin:0 0 6px">Änderungen werden automatisch direkt in die Datei auf GitHub
      geschrieben (<b>${esc(GH.owner+'/'+GH.repo)}</b>, ${esc(GH.path)}). Dafür einmal pro Browser einen Schlüssel eintragen:</p>
    <ol>
      <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → Fine-grained token erstellen</a></li>
      <li>Ablaufdatum wählen, bei <i>Repository access</i> «Only select repositories» → <b>${esc(GH.repo)}</b></li>
      <li>Bei <i>Permissions</i> → <i>Repository permissions</i> → <b>Contents: Read and write</b></li>
      <li>«Generate token», den Schlüssel kopieren und hier einfügen</li>
    </ol>
    <div class="frow"><label for="ghTok">Token</label>
      <input type="password" id="ghTok" placeholder="github_pat_…" autocomplete="off" value="${esc(ghToken)}"></div>
    <p class="note" style="margin:0 0 14px">Der Schlüssel bleibt nur in diesem Browser gespeichert. Wer die Seite
      ohne Schlüssel öffnet, kann alles ansehen; Änderungen werden dann nicht online gespeichert.</p>
    <p id="ghMsg" class="note" style="color:#b3412f;margin:0 0 10px"></p>
    <div class="fbtns"><button class="on" type="submit">Verbinden</button>
      <button type="button" onclick="$('ghdlg').close()">Abbrechen</button>
      <span style="margin-left:auto"></span>
      ${ghToken?`<button type="button" class="link" onclick="ghDisconnect()">Trennen</button>`:''}</div>
  </form>`;
  d.showModal();
}
async function ghConnect(){
  const tok=$('ghTok').value.trim(), msg=$('ghMsg');
  if(!tok){msg.textContent='Bitte den Token einfügen.';return}
  msg.style.color='var(--mute)';msg.textContent='prüfe …';
  try{
    const remote=await ghFetch(tok);
    ghToken=tok; try{localStorage.setItem(GH_KEY,tok)}catch(e){}
    const {data,js}=ghAdopt(remote); ghErr='';
    $('ghdlg').close();
    if(dirty&&js!==JSON.stringify(D)){
      if(confirm('Online liegt eine andere Fassung als hier im Browser.\n\nOK: die Fassung hier online speichern.\n'
        +'Abbrechen: die Online-Fassung laden.')){ghSave();return}
    }
    if(js!==JSON.stringify(D)){D=data;editing=null;draft=null}
    dirty=false;render();
  }catch(e){msg.style.color='#b3412f';msg.textContent=e.message}
}
function ghDisconnect(){
  ghToken='';ghSha=null;ghErr='';try{localStorage.removeItem(GH_KEY)}catch(e){}
  $('ghdlg').close();updateStatus();
}
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();saveFile()}

function importJSON(inp){
  if(!inp.files[0])return;
  const r=new FileReader();
  r.onload=()=>{try{const loaded=readData(r.result);clearTimeout(saveTimer);fileHandle=null;D=loaded;dirty=false;editing=null;draft=null;render()}
    catch(e){alert('Datei nicht lesbar: '+e.message)}};
  r.readAsText(inp.files[0]);
}
function exportCSV(){
  sortProgramm();
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['Nr','Termin','Zeit','Bis Tag','Bis','Thema','Veranstaltungsform','Format','Referent*innen','Extern','Zielgruppen','Notiz']];
  D.programm.forEach((p,i)=>{const t=D.themen.find(t=>t.thema===p.thema);
    rows.push([i+1,p.datum,p.zeit,multi(p)?p.bis:'',p.ende,p.thema,p.veranstaltungsform,t?t.formattyp:'',p.personen.join('; '),
      p.personen.filter(isX).join('; '),p.zielgruppen.join('; '),p.notiz])});
  const b=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='origen-programm.csv';a.click();
}
