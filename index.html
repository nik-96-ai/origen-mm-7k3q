<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Origen · Programm Mind-Map</title>
<style>
:root{
  --bg:#fbfaf8; --panel:#fff; --ink:#1d1b19; --mute:#7a736d; --faint:#a8a19b;
  --line:#e6e2dc; --line2:#d3ccc4; --fill:#f1eeea; --accent:#7a2e26;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
h1,h2,h3{font-weight:600;letter-spacing:-.01em}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=date],select,textarea{background:var(--panel);
  border:1px solid var(--line2);border-radius:5px;padding:5px 8px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
button{background:none;border:1px solid var(--line2);border-radius:5px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--ink)}
button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button.link{border:0;padding:3px 5px;color:var(--mute)}
button.link:hover{color:var(--ink);background:var(--fill)}

header{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.top{display:flex;align-items:center;gap:16px;padding:16px 0 12px}
.top h1{font-size:16px;margin:0}
.top .sub{font-size:12.5px;color:var(--faint)}
.top .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
nav{display:flex;gap:18px;overflow-x:auto}
nav button{border:0;border-radius:0;padding:0 0 10px;color:var(--mute);white-space:nowrap;
  border-bottom:1.5px solid transparent}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--ink);background:none}
nav .n{color:var(--faint);font-size:11.5px;margin-left:4px}

main{max-width:1180px;margin:0 auto;padding:24px 24px 80px}
section{display:none} section.on{display:block}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar label{font-size:12.5px;color:var(--mute);display:flex;gap:5px;align-items:center}
.note{font-size:12.5px;color:var(--faint);margin:0 0 20px}

/* --- cards --- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line)}
.card{background:var(--panel);padding:18px;position:relative}
.card.flash{background:#fdf8ec}
.card h3{margin:0 0 4px;font-size:15px;line-height:1.35;padding-right:20px}
.card .kind{font-size:11.5px;color:var(--faint);margin-bottom:9px}
.tlink{cursor:pointer;border-bottom:1px dotted var(--line2)}
.tlink:hover{color:var(--ink);border-bottom-color:var(--ink)}
.card p{margin:0 0 13px;font-size:13.5px;color:#443e39}
.row{margin-bottom:6px}
.lab{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  margin:0 0 5px}
.del{position:absolute;top:12px;right:12px;opacity:0}
.card:hover .del,details:hover .del{opacity:1}

/* --- zwei Chip-Typen --- */
.fmt{display:inline-block;font-size:11.5px;padding:3px 8px;border-radius:3px;background:var(--fill);
  color:#524b45;margin:0 4px 4px 0;cursor:pointer}
.fmt:hover{background:var(--line2)}
.per{display:inline-block;font-size:12.5px;padding:3px 11px;border-radius:99px;
  border:1px solid var(--line2);background:var(--panel);color:var(--ink);margin:0 4px 4px 0;cursor:pointer}
.per:hover{border-color:var(--ink)}
.per.ext{border-style:dashed}
.per .e{color:var(--faint);font-size:11px;margin-left:5px}
.per.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.per.sel .e{color:var(--line2)}

/* --- listen --- */
details.item{border-bottom:1px solid var(--line);position:relative}
details.item>summary{cursor:pointer;padding:11px 2px;list-style:none;display:flex;
  align-items:baseline;gap:10px}
details.item>summary::-webkit-details-marker{display:none}
details.item.flash{background:#fdf8ec}
.nm{font-weight:500}
.dash{width:14px;border-top:1px dashed var(--line2);align-self:center}
.rt{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap}
.body{padding:0 2px 18px 0;max-width:760px}
.body p{margin:0 0 14px;font-size:13.5px;color:#443e39}
.grouphead{margin:30px 0 2px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);border-bottom:1px solid var(--line2);padding-bottom:6px}

table.sheet{width:100%;border-collapse:collapse;font-size:13.5px}
table.sheet th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);padding:0 12px 7px 0;border-bottom:1px solid var(--line2);font-weight:500}
table.sheet td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
[contenteditable=true]{outline:none;background:#fdfaf1;box-shadow:inset 0 -1px 0 var(--line2);
  border-radius:2px}
[contenteditable=true]:focus{background:#fff;box-shadow:inset 0 -1px 0 var(--ink)}

/* --- programm --- */
.prog{border-bottom:1px solid var(--line);padding:20px 0;display:grid;
  grid-template-columns:30px 1fr;gap:14px}
.pn{font-size:12.5px;color:var(--faint);padding-top:2px}
.stats{display:flex;gap:34px;flex-wrap:wrap;padding:4px 0 22px;border-bottom:1px solid var(--line);
  margin-bottom:8px}
.stat .big{font-size:22px;font-weight:600}
.stat .lbl{font-size:11.5px;color:var(--faint)}
.picker{max-height:220px;overflow:auto;border:1px solid var(--line);padding:10px;margin-top:8px;
  columns:2;column-gap:22px}
.picker label{display:block;font-size:13px;padding:1px 0;cursor:pointer;break-inside:avoid}
.picker .gh{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  margin:10px 0 3px;break-inside:avoid}
/* --- Formular --- */
.form{border:1px solid var(--ink);padding:20px;margin-bottom:22px;background:var(--panel)}
.form h3{margin:0 0 18px;font-size:14px}
.frow{margin-bottom:16px}
.frow>label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);margin-bottom:5px}
.frow>label .cnt{color:var(--ink);letter-spacing:0;text-transform:none;font-size:11.5px}
.frow input[type=text],.frow textarea,.frow select{width:100%;max-width:620px}
.frow textarea{min-height:70px;resize:vertical}
.chosen{margin-bottom:7px;min-height:1px}
.fbtns{display:flex;gap:8px;padding-top:6px;border-top:1px solid var(--line);margin-top:20px}
.pfilter{margin-bottom:6px;width:220px!important}
.status{font-size:11.5px;color:var(--faint);white-space:nowrap}
.status.warn{color:#8a5a1a}
summary.more{font-size:12.5px;color:var(--mute);cursor:pointer;margin-top:8px;list-style:none}
summary.more::-webkit-details-marker{display:none}
summary.more:hover{color:var(--ink)}
.empty{color:var(--faint);padding:60px 0;text-align:center}
.doc h2{font-size:14px;margin:38px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--ink);
  letter-spacing:.02em}
.doc h2:first-child{margin-top:0}
@media print{
  header,.bar,.del,button,summary.more{display:none!important}
  body{background:#fff} section{display:none} section.on{display:block}
  main{padding:0;max-width:none}
  .card,.prog,tr,details{break-inside:avoid}
}

.topic-notes{margin-top:10px}
.topic-notes summary{cursor:pointer;font-size:12.5px;color:var(--mute)}
.topic-notes textarea{width:100%;min-height:80px;resize:vertical;margin-top:8px}
.drag-handle{cursor:grab;color:var(--faint);padding:2px 6px;touch-action:none}
.drag-handle:active{cursor:grabbing}
.drop-before{box-shadow:inset 0 3px var(--accent)}
.drop-after{box-shadow:inset 0 -3px var(--accent)}
.dragging{opacity:.45}
@media print{.drag-handle{display:none!important}}
.text-url{color:var(--accent);text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.text-url:hover{color:var(--ink)}
.url-preview{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;margin:6px 0 12px;color:var(--mute)}
.url-preview:empty{display:none}
.prog.flash{background:#fdf8ec}
input[type=time]{background:var(--panel);border:1px solid var(--line2);border-radius:5px;padding:5px 8px}

/* --- kalender, aufgebaut wie Google Kalender --- */
.gc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.gc-top h2{font-size:20px;font-weight:500;margin:0 auto 0 8px}
.gc-top .icon{border:0;font-size:20px;line-height:1;width:34px;height:34px;padding:0;border-radius:50%}
.gc-top .icon:hover{background:var(--fill)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 14px}
.seg button+button{border-left:1px solid var(--line2)}
.gc-body{display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:860px){.gc-body{grid-template-columns:minmax(0,1fr)} .gc-side{order:2}}
.gc-side .create{padding:10px 20px;border-radius:99px;border-color:var(--line);background:var(--panel);
  box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:500;margin-bottom:18px}
.gc-side .create:hover{box-shadow:0 2px 6px rgba(0,0,0,.18)}
.mini{margin-bottom:22px}
.mini-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.mini-h b{font-weight:500;font-size:13px}
.mini-h button{border:0;padding:0 7px;border-radius:50%}
.mini-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.mini-g span{color:var(--faint);font-size:10px;padding:3px 0}
.mini-g button{border:0;border-radius:50%;padding:0;width:27px;height:27px;margin:1px auto;
  font-size:11.5px;position:relative}
.mini-g button:hover{background:var(--fill)}
.mini-g button.out{color:var(--faint)}
.mini-g button.wk{background:var(--fill)}
.mini-g button.sel{background:var(--line2)}
.mini-g button.today{background:var(--accent);color:#fff}
.mini-g button.has::after{content:'';position:absolute;bottom:3px;left:50%;width:3px;height:3px;
  margin-left:-1.5px;border-radius:50%;background:currentColor;opacity:.55}

.ev{display:block;font-size:12px;line-height:1.35;padding:2px 7px;margin-bottom:2px;border-radius:4px;
  background:var(--c,var(--ink));color:#fff;cursor:pointer;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;user-select:none;touch-action:none}
/* mehrtägige Einträge laufen als Balken über die Tage */
.ev{position:relative}
.ev.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-4px;padding-left:11px}
.ev.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:-4px}
.ad-cell .ev.cl{margin-left:-3px}.ad-cell .ev.cr{margin-right:-3px}
.ev .rzx{position:absolute;top:0;right:0;bottom:0;width:8px;cursor:ew-resize}
.ev .rzx:hover{background:rgba(255,255,255,.35)}
.ev.dot .rzx:hover{background:var(--line)}
dialog.evdlg .two .lbl2{flex:0 0 52px;align-self:center;font-size:12.5px;color:var(--mute);margin-top:14px}
#ghdlg ol{padding-left:20px;font-size:13.5px;margin:8px 0 14px}
#ghdlg li{margin-bottom:4px}
#ghdlg input[type=password]{width:100%;font-family:ui-monospace,Menlo,monospace}
.status.online{color:#3f7356}
.status.err{color:#b3412f}
.ev.dot{background:none;color:var(--ink)}
.ev.dot::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--c);margin-right:6px;vertical-align:0}
.ev.dot:hover{background:var(--fill)}
.ev.t{background:var(--fill);color:#524b45}
.ev .tm{opacity:.75;margin-right:5px;font-variant-numeric:tabular-nums}
.ev:focus-visible,.blk:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.pool{border:1px dashed var(--line2);padding:6px;min-height:46px;border-radius:6px}
.pool.themes{max-height:300px;overflow:auto;border:1px solid var(--line)}
.over{background:#fdf8ec!important;box-shadow:inset 0 0 0 1.5px var(--accent)}
.legend{display:flex;gap:5px;flex-wrap:wrap;margin-top:18px}
.legend .ev{display:inline-block;cursor:default}
.ghost{position:fixed;z-index:100;pointer-events:none;max-width:220px;box-shadow:0 4px 14px rgba(0,0,0,.22)}
body.cal-dragging,body.cal-dragging *{cursor:grabbing!important;user-select:none}

/* Zeitraster für Tag und Woche */
.tg{border:1px solid var(--line);background:var(--panel);border-radius:6px;overflow:hidden}
.tg-row{display:grid;grid-template-columns:56px repeat(var(--n),minmax(0,1fr))}
.tg-dh{text-align:center;padding:8px 0 6px}
.tg-dh .dw{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.tg-dh .dnum{border:0;font-size:22px;width:42px;height:42px;padding:0;border-radius:50%;line-height:1}
.tg-dh .dnum:hover{background:var(--fill)}
.tg-dh.today .dw{color:var(--accent)}
.tg-dh.today .dnum{background:var(--accent);color:#fff}
.gut{font-size:10px;color:var(--faint);text-align:right;padding-right:8px}
.tg-head .gut{align-self:end;padding-bottom:8px}
.tg-all{border-bottom:1px solid var(--line2)}
.tg-all .gut{padding-top:7px}
.ad-cell{border-left:1px solid var(--line);padding:3px 3px 4px;min-height:30px;min-width:0}
.tg-scroll{height:min(660px,calc(100vh - 280px));min-height:360px;overflow-y:auto}
.hours{position:relative}
.hours span{position:absolute;right:8px;transform:translateY(-50%)}
.tg-col{position:relative;min-width:0;border-left:1px solid var(--line);
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 48px}
.tg-col.today{background-color:#fdfbf7}
.blk{position:absolute;border-radius:5px;background:var(--c);color:#fff;font-size:12px;line-height:1.3;
  padding:3px 6px;overflow:hidden;cursor:pointer;box-shadow:0 0 0 1px var(--panel);user-select:none;
  touch-action:none;z-index:1}
.blk .bt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .bm{opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.blk.short{display:flex;gap:6px;align-items:baseline;padding-top:1px}
.blk.short .bt{flex:0 1 auto;min-width:0}
.blk.short .bm{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.blk .rz{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.blk.preview{z-index:5;pointer-events:none;opacity:.92;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.dragging{opacity:.35}
.now{position:absolute;left:-1px;right:0;height:2px;background:#d93025;z-index:3;pointer-events:none}
.now::before{content:'';position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:50%;
  background:#d93025}

/* Monat */
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);
  border-radius:6px;overflow:hidden;background:var(--panel)}
.mg .dow{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);
  text-align:center;padding:7px 0 2px;border-left:1px solid var(--line)}
.mday{min-height:120px;padding:3px 4px 6px;border-left:1px solid var(--line);border-top:1px solid var(--line);
  min-width:0}
.mg .dow:nth-child(7n+1),.mday:nth-child(7n+1){border-left:0}
.mday .dn{display:block;margin:0 auto 3px;border:0;font-size:12px;padding:0 6px;height:24px;
  min-width:24px;border-radius:99px}
.mday .dn:hover{background:var(--fill)}
.mday.out .dn{color:var(--faint)}
.mday.today .dn{background:var(--accent);color:#fff}
.mday .more{display:block;font-size:11.5px;padding:1px 7px;color:var(--ink);font-weight:500}

dialog.evdlg{border:1px solid var(--line2);border-radius:10px;padding:22px;width:calc(100% - 32px);
  max-width:460px;background:var(--panel);color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.2)}
dialog.evdlg::backdrop{background:rgba(29,27,25,.28)}
dialog.evdlg h3{margin:0 0 4px;font-size:15px}
dialog.evdlg .frow input,dialog.evdlg .frow textarea{width:100%}
dialog.evdlg .two{display:flex;gap:10px}
dialog.evdlg .two .frow{flex:1;min-width:0}
dialog.evdlg .chk{display:flex;gap:7px;align-items:center;font-size:13px;margin:-6px 0 16px;cursor:pointer}
.sw{display:flex;gap:9px;flex-wrap:wrap;padding:3px 2px}
.swl{position:relative}
.swl input{position:absolute;opacity:0}
.swl span{display:block;width:22px;height:22px;border-radius:50%;cursor:pointer}
.swl input:checked+span{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.swl input:focus-visible+span{outline:2px solid var(--ink);outline-offset:3px}
@media print{.gc-side,.gc-top .seg{display:none} .gc-body{display:block}
  .tg-scroll{height:auto;overflow:visible}}
</style>
</head>
<body>

<header><div class="wrap">
 <div class="top">
  <h1>Origen · Programm Mind-Map</h1>
  <span class="sub">digitales Bauen</span>
  <span class="sp">
   <input type="text" id="q" placeholder="Suchen" style="width:150px">
   <span class="status" id="status"></span>
   <button class="link" id="linkbtn" onclick="saveFile()">Speichern</button>
   <button class="link" id="ghbtn" onclick="ghSetup()">Online speichern …</button>
   <button class="link" onclick="loadFile()">Laden</button>
   <input type="file" id="imp" accept=".html,.json" style="display:none" onchange="importJSON(this)">
   <button class="link" onclick="window.print()">Drucken</button>
  </span>
 </div>
 <nav id="tabs"></nav>
</div></header>

<main>
 <section id="t-themen"></section>
 <section id="t-personen"></section>
 <section id="t-formen"></section>
 <section id="t-teilnehmende"></section>
 <section id="t-typen"></section>
 <section id="t-programm"></section>
 <section id="t-kalender"></section>
 <section id="t-gesamt"></section>
</main>
<dialog class="evdlg" id="evdlg"></dialog>

<script id="seed" type="application/json">{"personen":[{"name":"Benjamin Dillenburger","gruppe":"Digitales Bauen dbt","extern":false,"beschreibung":"Professor für Digital Building Technologies am ITA der ETH Zürich. Forscht zu grossformatigem 3D-Druck, computergestützter Geometrie und neuen Bauteilen. Entwarf mit Michael Hansmeyer den Weissen Turm (Tor Alva) in Mulegns – das höchste 3D-gedruckte Gebäude der Welt – und zuvor die gedruckten Säulen von Concrete Choreography in den Gärten der Villa Carisch in Riom."},{"name":"Ana Anton","gruppe":"Digitales Bauen dbt","extern":false,"beschreibung":"Postdoktorandin am DBT und im NFS Digitale Fabrikation, wo sie die Forschung zum 3D-Betondruck leitet. Dissertation 2022 «Tectonics of Concrete Printed Architecture»; entwickelte die robotische Extrusion für grossformatige Bauteile, die 2019 bei Concrete Choreography in Riom und später bei Tor Alva zum Einsatz kam. Architekturstudium cum laude an der TU Delft."},{"name":"Matthias Leschok","gruppe":"Digitales Bauen dbt","extern":false,"beschreibung":"Doktorand am DBT. Polymer-3D-Druck für dünne, lichtdurchlässige Bauteile und gedruckte Schalungen – Elemente, die sich zwischen Bühnenbild und Fassade bewegen und für temporäre Bauten interessant sind."},{"name":"Maria Smigielska","gruppe":"Digitales Bauen dbt","extern":false,"beschreibung":"Architektin und Forscherin am DBT. Arbeitet daran, Materialeigenschaften gezielt zu kodieren und zu modulieren – meist über eigens entwickelte, überwiegend robotische Fertigungsverfahren. Von Metallbiegen über Designobjekte bis zu interaktiven Installationen."},{"name":"Angela Yoo","gruppe":"Digitales Bauen dbt","extern":false,"beschreibung":"Wissenschaftliche Mitarbeiterin am DBT, unter anderem in der Lehre (Kurs «Panorama» mit Benjamin Dillenburger und Patrick Bedarf). Additive Fertigung und Materialsysteme für architektonische Bauteile."},{"name":"Tiziano Derme","gruppe":"Digitales Bauen dbt","extern":false,"beschreibung":"Architekt am DBT. Untersucht das Verhältnis von Entwurf, neuen Materialien und Biotechnologie in der digitalen und robotischen Fertigung; publiziert unter anderem zu myzelbasierten Materialien und Hydrogelen – Bauteilen, die man am Ende wieder auflösen kann."},{"name":"Victoria Roznowski","gruppe":"Digitales Bauen dbt","extern":false,"beschreibung":"DBT. Computergestützter Entwurf und digitale Fertigung. Öffentlich noch wenig dokumentiert – Profil bitte selbst ergänzen."},{"name":"Karen A. Antorveza Páez","gruppe":"Digitales Bauen dbt","extern":false,"beschreibung":"Doktorandin am DBT und Tutorin in den Kursen der Professur. Arbeitet an der Schnittstelle von Design, digitaler Fabrikation und Biotechnologie."},{"name":"Nik Eftekhar","gruppe":"Digitales Bauen dbt","extern":false,"beschreibung":"DBT – dein eigenes Profil. Bitte selbst ergänzen."},{"name":"Ariel Lim","gruppe":"Digitales Bauen dbt","extern":false,"beschreibung":"DBT. Digitale Fabrikation und robotische Prozesse. Profil bitte selbst ergänzen."},{"name":"Patrick Bedarf","gruppe":"Digitales Bauen dbt","extern":false,"beschreibung":"Architekt und Senior Lecturer am DBT. Dissertation 2023 «Architected Porosity» zum Mineralschaum-3D-Druck für leichte, dämmende Bauteile. Im Projekt Airlements entstand ein 2 m hohes Wandelement aus vier gedruckten Teilen mit zementfreiem Putz; das Dämmmaterial stammt vom ETH-Spin-off FenX und wird aus recycelten Industrieabfällen hergestellt."},{"name":"Anton Savov","gruppe":"Digitales Bauen dbt","extern":false,"beschreibung":"Architekt und Postdoktorand am DBT bei Benjamin Dillenburger. Entwickelt «architectural machine intelligence» – Werkzeuge, die die gestalterischen Fähigkeiten beim Entwerfen und Bauen erweitern statt sie zu ersetzen."},{"name":"Andrei Jipa","gruppe":"Digitales Bauen dbt","extern":false,"beschreibung":"DBT. 3D-gedruckte Schalungen und Betonbauteile; einer der produktivsten Autoren der Gruppe zu Druckverfahren und Formenbau, unter anderem für Tor Alva. Der richtige Ansprechpartner, wenn es praktisch werden soll."},{"name":"Bernd Bickel","gruppe":"Computer Vision/Graphics CDL","extern":false,"beschreibung":"Professor für Computational Design an der ETH (D-ARCH und D-BAUG), leitet das Computational Design Laboratory. Computergrafik an der Schnittstelle zu Robotik, Computer Vision, Machine Learning, Materialwissenschaft und digitaler Fertigung; Ziel sind Werkzeuge, die physikalische Eigenschaften automatisch optimieren, ohne die gestalterischen Ziele aufzugeben. Zuvor Professor am IST Austria, Doktorat bei Markus Gross an der ETH."},{"name":"Bharath Seshadri","gruppe":"Computer Vision/Graphics CDL","extern":false,"beschreibung":"Postdoktorand am CDL. Bauingenieur mit über zehn Jahren Erfahrung in computergestützten Werkzeugen für Gebäudetechnik und nachhaltige Architektur; Doktorat an der ETH zu thermischen Energiesystemen für robotisch gefertigte Gebäude. Forscht heute zu Computergrafik und Extended Reality für Bauphysik – also daran, Wärmeströme sichtbar zu machen."},{"name":"Desmond Liu","gruppe":"Computer Vision/Graphics CDL","extern":false,"beschreibung":"Zhenyuan «Desmond» Liu, Doktorand am CDL in Computergrafik. Szenenverständnis aus Wärmebildern über inverse Wärmetransportprobleme, mit dem Ziel, thermische Effizienz und Komfort von Gebäuden zu verbessern. Interessiert sich daneben für Maschinenstickerei als Fertigungstechnik."},{"name":"Rafael Bischof","gruppe":"Computer Vision/Graphics CDL","extern":false,"beschreibung":"Doktorand am CDL. Scientific Machine Learning: physikalisches Wissen wird in Lernalgorithmen eingebettet, damit sie in Ingenieuranwendungen zuverlässig bleiben. Schwerpunkt sind neuronale Operatoren zum Lösen von Differentialgleichungen sowie inverses Design unter physikalischen Randbedingungen."},{"name":"Anna Maria Eggler","gruppe":"Computer Vision/Graphics CDL","extern":false,"beschreibung":"Doktorandin am CDL mit Hintergrund in Informatik und Computergrafik. Untersucht, wie computergestützter Entwurf nachhaltigere Fertigung ermöglicht – Schwerpunkt auf weniger Materialverschnitt und Wiederverwendung, an der Schnittstelle von Geometrieverarbeitung und digitaler Fabrikation."},{"name":"Pengbin Tang","gruppe":"Computer Vision/Graphics CDL","extern":false,"beschreibung":"Postdoktorand am CDL, Doktorat in Informatik an der Université de Montréal. Verbindet Computergrafik, Maschinenbau, Materialwissenschaft, Robotik und digitale Fertigung; nutzt physikalische Simulation, Optimierungsverfahren und Machine Learning für den Entwurf von Materialien und Strukturen mit komplexer Form und Funktion."},{"name":"Kenji Tojo","gruppe":"Computer Vision/Graphics CDL","extern":false,"beschreibung":"Postdoktorand am CDL. Computergrafik: neuronale und differenzierbare Verfahren für die Darstellung von Materialien, Erscheinungsbild und Bewegung – die Werkzeuge, mit denen man ein Bauteil realistisch zeigen kann, bevor es existiert."},{"name":"Sophia Kuhn","gruppe":"Computer Vision/Graphics CDL","extern":false,"beschreibung":"Postdoktorandin am CDL. Promovierte bei Walter Kaufmann (Massiv- und Brückenbau), mitbetreut von Fernando Pérez-Cruz und Michael Kraus. Entwickelte mit der SBB ein KI-Modell für Rahmenbrücken – in der Schweiz besonders häufige Eisenbahnbrücken aus Stahlbeton – sowie datengetriebene Verfahren für die Zustandsbeurteilung, die teure Ersatzneubauten alternder Infrastruktur vermeiden sollen."},{"name":"Jeremy Chew","gruppe":"Computer Vision/Graphics CDL","extern":false,"beschreibung":"Doktorand am CDL. Profil öffentlich noch nicht ausgeführt – bitte selbst ergänzen."},{"name":"Silke Langenberg","gruppe":"Heritage","extern":false,"beschreibung":"Professorin für Konstruktionserbe und Denkmalpflege an der ETH, angesiedelt am Institut für Denkmalpflege und Bauforschung und am ITA. Seit ihrer Dissertation über «Bauten der Boomjahre» forscht sie zu Entwicklung, Reparatur und langfristigem Erhalt seriell, industriell und digital produzierter Bauten. Baut mit dem Materialarchiv und weiteren Partnern ein Digitales Konstruktionsarchiv auf – eine offene Forschungsdatenbank als digitales Gedächtnis des Schweizer Bauerbes."},{"name":"Wen-Shan Cui","gruppe":"Heritage","extern":false,"beschreibung":"Doktorandin im Projekt «Digital Construction Archive» an ITA und IDB. Forscht zu Unterhalt, Reparatur und Archivierung digital gefertigter Architektur – also genau der Frage, die sich bei Tor Alva in zwanzig Jahren stellen wird."},{"name":"Dominik Reisach","gruppe":"Heritage","extern":false,"beschreibung":"Doktorand mit Interesse an algorithmischem Entwurf, digitaler Fertigung und traditionellem Handwerk. Entwickelt Entwurfswerkzeuge und Fertigungsprozesse, um Steinabfälle mit unregelmässiger Geometrie für architektonische Oberflächen weiterzuverwenden – naheliegend für einen Kanton voller Steinbrüche."},{"name":"Stefania Rasile","gruppe":"Heritage","extern":false,"beschreibung":"Doktorandin, geführt am Computational Design Laboratory und an der Professur Langenberg. Denkmalpflege und Bauforschung mit computergestützten Methoden."},{"name":"Matthias Brenner","gruppe":"Heritage","extern":false,"beschreibung":"Postdoktorand an der Professur Konstruktionserbe (seit 2025) und Koordinator der MAS- und CAS-Programme. In seiner Dissertation (2020–2025) untersuchte er im Projekt «High-Tech for High-Tech» das Potenzial digitaler Fertigung für die Reparatur der High-Tech-Architektur der 1980er-Jahre – passgenaue Ersatzteile statt Grossersatz, im Rahmen des NFS Digitale Fabrikation. Erste Adresse für MAS-Formate."},{"name":"Christian Schmid","gruppe":"Soziologie","extern":false,"beschreibung":"Soziologe und Stadtforscher an der ETH. Arbeiten zur «planetarischen Urbanisierung», zur gesellschaftlichen Produktion von Raum und zur Frage, wie sich Territorien ausserhalb der Städte verändern. Der Gegenpol, der ein Technologieprogramm davor bewahrt, nur über Maschinen zu reden."},{"name":"Liu Yiqiu","gruppe":"Soziologie","extern":false,"beschreibung":"Urbanistik und Stadtsoziologie an der ETH. Profil bitte selbst ergänzen."},{"name":"Catherine De Wolf","gruppe":"Circular Construction CEA","extern":false,"beschreibung":"Assistenzprofessorin für Circular Engineering for Architecture. Leitet ein interdisziplinäres Team aus Bauingenieurwesen, Architektur, Urbanistik und Informatik mit dem Ziel, die Wiederverwendung von Bauteilen zu automatisieren. Entwickelte einen fünfstufigen digitalen Kreislauf-Workflow – digitale Produktpässe, KI-gestützte Materialklassifikation, Reality Capture, computergestützter Entwurf, Blockchain – und demontierte dafür mehrere Abbruchgebäude. Herausgeberin von «A Circular Built Environment in the Digital Age» (Springer, open access). Doktorat und MSc am MIT."},{"name":"Mikhael Johanes","gruppe":"Circular Construction CEA","extern":false,"beschreibung":"Design++ Postdoctoral Fellow am CEA. Entwickelt multimodale generative Modelle für Umbau und Weiternutzung von Bestandsgebäuden, im Rahmen des Projekts SWIRCULAR zur digitalen Transformation des zirkulären Bauens."},{"name":"Kasimir Forth","gruppe":"Circular Construction CEA","extern":false,"beschreibung":"Postdoktorand am CEA. BIM, automatisierte Ökobilanzierung und digitale Werkzeuge für zirkuläres Bauen – der Teil der Forschung, der sich am direktesten in ein Planungsbüro übersetzen lässt."},{"name":"Clara Blum","gruppe":"Circular Construction CEA","extern":false,"beschreibung":"Computational Designer und Doktorandin am CEA. B.Sc. Architektur TU Berlin, M.Sc. ITECH Stuttgart; Masterarbeit «Reclaimed Design» über eine verfügbarkeitsorientierte Entwurfsmethodik für wiedergewonnenes Bauholz. Entwickelt in der Innosuisse-Initiative Think Earth ein standardisiertes digitales ID-System für regenerative Materialien wie Holz und Lehm, das Lebenszyklen in Schweizer Lieferketten nachverfolgbar macht."},{"name":"Zain Karsan","gruppe":"Circular Construction CEA","extern":false,"beschreibung":"Doktorand am CEA, arbeitet zugleich mit dem DBT. M.Arch (2018) und M.Sc. Computational Design and Mechanical Engineering (2023) am MIT, Masterarbeit «Liquid Metal Printing»; dort auch technischer Instruktor für digitale Fabrikation, Robotik und Präzisionsbearbeitung. Entwickelt robotische Systeme für den selektiven Rückbau – Maschinen, die Gebäude auseinandernehmen statt aufbauen."},{"name":"Vanessa Schwarzkopf","gruppe":"Circular Construction CEA","extern":false,"beschreibung":"Doktorandin am CEA seit Januar 2024. Digitale Methoden für zirkuläres Bauen und die strukturierte Erfassung des Gebäudebestands."},{"name":"Vanessa Costalonga Martins","gruppe":"Circular Construction CEA","extern":false,"beschreibung":"Doktorandin am CEA. Computational Design, digitale Fertigung und Materialforschung. Diplom in Architektur und Urbanismus der Universidade de Brasília, M.Sc. ITECH Stuttgart, zuvor wissenschaftliche Mitarbeiterin am Lehrstuhl BioMat für biobasierte Materialien und Materialkreisläufe."},{"name":"Bayonle Windapo","gruppe":"Circular Construction CEA","extern":false,"beschreibung":"Computational Designer und Architekt, Doktorand am CEA. Verbindet BIM, computergestützten Entwurf und Reality Capture, um semantische Wiederverwendungsdaten zu erzeugen – aus einem Scan wird ein Datensatz, mit dem sich ein Bauteil tatsächlich handeln lässt."},{"name":"Vasiliki Kirtsou","gruppe":"Circular Construction CEA","extern":false,"beschreibung":"Vasiliki Kirtsou is a researcher at the Chair of Circular Engineering for Architecture (CEA) led by Prof. Dr. Catherine De Wolf at ETH Zurich, focusing on digital workflows and sustainable reuse in circular construction."},{"name":"Fabio Gramazio","gruppe":"Digitales Bauen GKR","extern":false,"beschreibung":"Professor für Architektur und digitale Fabrikation, gemeinsam mit Matthias Kohler Gramazio Kohler Research. Pioniere der robotischen Fertigung in der Architektur seit 2005. Ihr erstes gebautes Projekt steht in Graubünden: die roboterisch gemauerte Fassade des Weinguts Gantenbein in Fläsch."},{"name":"Matthias Kohler","gruppe":"Digitales Bauen GKR","extern":false,"beschreibung":"Professor, gemeinsam mit Fabio Gramazio. Leitete den Nationalen Forschungsschwerpunkt Digitale Fabrikation, aus dem ein grosser Teil der hier versammelten Technologien überhaupt erst hervorgegangen ist – von Tor Alva bis zum DFAB House."},{"name":"Gonzalo Casas","gruppe":"Digitales Bauen GKR","extern":false,"beschreibung":"Software-Entwickler bei Gramazio Kohler Research und einer der Hauptentwickler von COMPAS, dem offenen Python-Framework für computergestützten Entwurf, Robotik und Fertigung im Bauwesen. Die Software, mit der ein kleines Büro ohne Lizenzkosten anfangen kann."},{"name":"Eric Gozzi","gruppe":"Digitales Bauen GKR","extern":false,"beschreibung":"Gramazio Kohler Research. Robotische Fertigung und Software für Bauprozesse. Profil bitte selbst ergänzen."},{"name":"Philippe Block","gruppe":"Block Research Group ETH","extern":false,"beschreibung":"Professor für Tragwerksentwurf an der ETH und Leiter der Block Research Group. Forscht zu Gewölbetragwerken, Formfindung und materialsparenden Decken; gebaute Beispiele sind das gekrümmte HiLo-Dach im NEST der Empa und die schalungsfrei montierte, 3D-gedruckte Steinbogenbrücke Striatus. Sein Argument in einem Satz: Geometrie kann Material ersetzen."},{"name":"Daniela Mitterberger","gruppe":"Human Augmentation ETH","extern":false,"beschreibung":"Assistenzprofessorin für Architecture and Human Augmentation an der ETH, berufen im Dezember 2025, zuvor Princeton. Doktorat 2023 an der ETH zu «Adaptive digital fabrication and human-machine collaboration for architecture»; leitet die Entwicklung von COMPAS XR, einem offenen Framework für Extended Reality und Robotik im Bauwesen. Mitgründerin des Wiener Büros MAEID."},{"name":"Elisabetta Fedele","gruppe":"AI Center ETH","extern":false,"beschreibung":"Doctoral Fellow am ETH AI Center. 3D-Szenenverständnis, 3D-Rekonstruktion und Diffusionsmodelle; das Ziel ist, Weltmodelle in kompakten 3D-Repräsentationen zu verankern. Arbeiten: SuperDec, das 3D-Szenen in Superquadriken zerlegt (ICCV 2025), und OpenMask3D zur Open-Vocabulary-Instanzsegmentierung in 3D (NeurIPS 2023)."},{"name":"Haoyang Zhou","gruppe":"AI Center ETH","extern":false,"beschreibung":"Doktorand am ETH AI Center, angesiedelt am Computational Design Laboratory. Machine Learning für Entwurf und Fertigung."},{"name":"Raphael Baur","gruppe":"AI Center ETH","extern":false,"beschreibung":"ETH AI Center. Computer Vision und Machine Learning. AI in architecture, human-AI collaboration, intelligence augmentation, reinforcement learning, probabilistic programming."},{"name":"Russell Loveridge","gruppe":"NFS Digitale Fabrication","extern":false,"beschreibung":"Geschäftsführer des NFS Digitale Fabrikation seit dessen offiziellem Start in 2014."},{"name":"Ramon Weber","gruppe":"UC Berkeley","extern":false,"beschreibung":"Assistenzprofessor für Architektur an der UC Berkeley (College of Environmental Design) und Leiter des Spatial Systems Lab. Doktorat am MIT in Building Technology zu Werkzeugen für Entwurf und Analyse CO₂-armer Gebäude; Studium an ETH, Universität Stuttgart und MIT Media Lab. Untersucht, wie computergestützter Entwurf, KI und Gebäudesimulation zu nachhaltigerer Architektur führen."},{"name":"Alexander Htet Kyaw","gruppe":"MIT","extern":false,"beschreibung":"Doppelabschluss-Kandidat am MIT (M.Sc. Architectural Studies in Computation und M.Sc. Electrical Engineering and Computer Science); arbeitet mit dem Digital Structures Lab, dem Media Lab und dem CSAIL. Verbindet KI, Augmented Reality und Robotik mit Gesten-, Sprach- und Objekterkennung. Projekte: «Speech to Reality» mit Neil Gershenfeld – eine gesprochene Beschreibung wird über generative 3D-Modelle zu einem robotisch gefertigten Objekt – und der Unlog Tower aus Eschenstämmen, in AR mit der Fingerspitze vermessen."},{"name":"Neil Gershenfeld","gruppe":"MIT","extern":false,"beschreibung":"Direktor des MIT Center for Bits and Atoms. Begründer der weltweiten Fab-Lab-Bewegung und des Kurses «How to Make Almost Anything»; arbeitet an digitalen Materialien und selbstassemblierenden Strukturen. Das interessanteste Modell, falls aus einer Reihe von Veranstaltungen eine dauerhafte Werkstatt vor Ort werden soll."},{"name":"Martin Bechthold","gruppe":"Harvard GSD","extern":false,"beschreibung":"Professor für Architekturtechnologie an der Harvard GSD, leitet die Material Processes and Systems Group. Robotik, Keramik und neue Materialprozesse im Bauwesen – und die Frage, wie sich Handwerkstradition und automatisierte Fertigung verbinden lassen, statt sich auszuschliessen."},{"name":"Gilles Retsin","gruppe":"ITA Gastdozentur / Design Computation","extern":false,"beschreibung":"Architekt an der Bartlett School of Architecture (UCL), Programmdirektor des M.Arch Architectural Design und Mitgründer des Design Computation Lab. «Discrete Architecture»: Bauen aus wenigen, identischen, robotisch fügbaren Bausteinen, die sich aus verbreitetem Plattenmaterial zuschneiden lassen. Erster Preis an der Tallinn Architecture Biennale und Installation an der Royal Academy of Arts. Seit 2024 Gastdozent am ITA der ETH."},{"name":"Johan Wijesinghe","gruppe":"ITA Gastdozentur / Design Computation","extern":false,"beschreibung":"Architekt und Forscher aus Los Angeles. Computational Design, generativer Entwurf, Massivholz-Vorfertigung und KI in der Architektur. 2020–2024 bei LEVER Architecture, wo er als Projektdesigner und BIM-Manager Tragwerkssysteme für Erdbeben-, Brand- und Akustikanforderungen entwickelte, darunter Diagrid-Exoskelette aus Holz und Rocking-Wall-Systeme. Unterrichtet mit Gilles Retsin das Studio «Architecture in Large Quantities» am ITA."},{"name":"Greg Demchak","gruppe":"Bentley Studio","extern":false,"beschreibung":"Bentley Systems, Bentley Studio. Digitale Zwillinge und die iTwin-Plattform; Visualisierung und Auswertung grosser Infrastrukturdatensätze. Naheliegender Partner, sobald RhB oder Tiefbauamt einen digitalen Zwilling ihrer Kunstbauten wollen."},{"name":"Madeline Gannon","gruppe":"AntonAnton","extern":false,"beschreibung":"Madeline Gannon is a multidisciplinary designer and roboticist who tames robots to make us feel. Known as the \"Robot Whisperer,\" her work bridges cutting-edge robotics, AI, and the human experience, proving that creativity is essential to shaping how these technologies impact society. As a former NVIDIA roboticist, she brings deep technical fluency to building more optimistic futures with machines."},{"name":"Michael Hansmeyer","gruppe":"Extern – Forschung international","extern":true,"beschreibung":"Architekt und Programmierer in Zürich. Entwarf mit Benjamin Dillenburger Tor Alva sowie algorithmisch erzeugte Räume und Säulen («Digital Grotesque»). Arbeitet mit Subdivisionsverfahren, die Geometrien erzeugen, die kein Mensch zeichnen würde."},{"name":"Kathrin Dörfler","gruppe":"Extern – Forschung international","extern":true,"beschreibung":"Professorin für Digital Fabrication an der TU München, leitet das Augmented Fabrication Lab. Robotische und Mixed-Reality-Fertigung direkt auf der Baustelle – sie instruiert Maurer über AR-Schnittstellen, damit sie geometrisch präzise Bauteile nach 3D-Modell errichten können. Best Workshop Award der ROB|ARCH 2024."},{"name":"Achim Menges","gruppe":"Extern – Forschung international","extern":true,"beschreibung":"Professor am Institut für Computerbasiertes Entwerfen (ICD) der Universität Stuttgart. Robotischer Holzbau, bio-inspirierte Materialsysteme und die BUGA-Pavillons – der wohl sichtbarste Beleg dafür, dass Forschungspavillons ein Publikum finden."},{"name":"Jan Knippers","gruppe":"Extern – Forschung international","extern":true,"beschreibung":"Professor am Institut für Tragkonstruktionen und Konstruktives Entwerfen (ITKE) in Stuttgart. Tragwerksentwurf für Faserverbund- und Leichtbaustrukturen, langjähriger Partner von Achim Menges."},{"name":"Sigrid Brell-Cokcan","gruppe":"Extern – Forschung international","extern":true,"beschreibung":"Professorin für Individualized Production an der RWTH Aachen. Baurobotik, Maschinensteuerung und Sicherheit auf der Baustelle; treibt die Standardisierung von Robotik im Bauprozess voran."},{"name":"Norman Hack","gruppe":"Extern – Forschung international","extern":true,"beschreibung":"Professor an der TU Braunschweig. Additive Fertigung im Bauwesen, insbesondere Bewehrungsstrategien für gedruckten Beton – die Frage, die entscheidet, ob 3D-Druck tragende Bauteile hervorbringen kann."},{"name":"Konrad Schindler","gruppe":"Extern – Forschung international","extern":true,"beschreibung":"Professor für Photogrammetrie und Fernerkundung an der ETH. 3D-Rekonstruktion und Bildanalyse aus Luft-, Drohnen- und Satellitendaten – die Grundlage jeder grossflächigen digitalen Bestandsaufnahme."},{"name":"Marc Pollefeys","gruppe":"Extern – Forschung international","extern":true,"beschreibung":"Professor für Computer Vision an der ETH. 3D-Rekonstruktion, SLAM und Mixed Reality; leitete zuvor die Forschung zu Microsoft HoloLens. Wenn Kameras auf einer Baustelle verstehen sollen, was sie sehen, kommt man an dieser Gruppe nicht vorbei."},{"name":"Francis Engelmann","gruppe":"Extern – Forschung international","extern":true,"beschreibung":"Forscher zu 3D-Szenenverständnis und Open-Vocabulary-Segmentierung, Ko-Autor von OpenMask3D. Arbeitet daran, dass sich 3D-Szenen mit normaler Sprache durchsuchen lassen."},{"name":"Zindel United","gruppe":"Extern – Praxis & Industrie","extern":true,"beschreibung":"Bündner Holz- und Baubetrieb. Führte den Bau von Tor Alva in Mulegns aus – der naheliegendste Praxispartner für Hands-on-Formate, und der Beleg, dass ein regionaler Betrieb solche Projekte kann."},{"name":"FenX AG","gruppe":"Extern – Praxis & Industrie","extern":true,"beschreibung":"ETH-Spin-off. Mineralische Dämmschäume aus recycelten Industrieabfällen; das Material hinter Patrick Bedarfs Airlements."},{"name":"Empa / NEST","gruppe":"Extern – Praxis & Industrie","extern":true,"beschreibung":"Schweizer Materialforschung mit dem Gebäudedemonstrator NEST in Dübendorf – ein durchgehend funktionierendes Vorbild für «Bauen als Versuchsanordnung», inklusive Betriebsmodell."},{"name":"Holcim Innovation Center","gruppe":"Extern – Praxis & Industrie","extern":true,"beschreibung":"Zement- und Betontechnologie, Materialentwicklung für 3D-Druckverfahren."},{"name":"Sika Schweiz","gruppe":"Extern – Praxis & Industrie","extern":true,"beschreibung":"Bauchemie und Zusatzmittel für digitale Fertigungsverfahren; ohne die richtige Rezeptur druckt kein Roboter."},{"name":"Bentley Systems","gruppe":"Extern – Praxis & Industrie","extern":true,"beschreibung":"Software für digitale Zwillinge von Infrastruktur (iTwin). Der Kontakt besteht bereits über Greg Demchak."},{"name":"Autodesk Research","gruppe":"Extern – Praxis & Industrie","extern":true,"beschreibung":"Forschung zu generativem Entwurf und Fertigungssoftware; interessant als Sponsor und als Gegenposition zu Open Source."},{"name":"Innosuisse","gruppe":"Extern – Praxis & Industrie","extern":true,"beschreibung":"Schweizerische Agentur für Innovationsförderung. Mögliche Ko-Finanzierung von Transferprojekten neben GRdigital – Clara Blums Arbeit läuft bereits über eine Innosuisse-Initiative."},{"name":"Implenia / Rhomberg Digital","gruppe":"Extern – Praxis & Industrie","extern":true,"beschreibung":"Baukonzerne mit eigenen Digitalisierungseinheiten. Nützliches Gegengewicht zur reinen Forschungsperspektive, wenn es um Kosten und Termine geht."},{"name":"Gion A. Caminada","gruppe":"Extern – Graubünden & Region","extern":true,"beschreibung":"Architekt in Vrin, emeritierter Professor der ETH. Bauen aus dem Ort heraus, Strickbau, alpine Baukultur. Der produktivste Gegenpol zu einem reinen Technologieprogramm – und jemand, dem im Kanton zugehört wird."},{"name":"Jürg Conzett","gruppe":"Extern – Graubünden & Region","extern":true,"beschreibung":"Bauingenieur, Conzett Bronzini Partner in Chur. Brückenbau in Graubünden, darunter der Traversinersteg und die Punt da Suransuns. Zeigt, dass Ingenieurskunst im Kanton auch ohne Digitalisierung Weltklasse war – ein gutes Korrektiv für jedes KI-Panel."},{"name":"Bearth & Deplazes","gruppe":"Extern – Graubünden & Region","extern":true,"beschreibung":"Architekturbüro in Chur. Unter anderem die Neue Monte-Rosa-Hütte, digital geplant mit der ETH, und die Weingut-Gantenbein-Fassade in Fläsch zusammen mit Gramazio Kohler."},{"name":"Fachhochschule Graubünden","gruppe":"Extern – Graubünden & Region","extern":true,"beschreibung":"Chur. Bachelor Computational and Data Science, Bauingenieurwesen, Mobile Robotics und Photonics; Forschungsschwerpunkte auf angewandten Zukunftstechnologien und der Entwicklung im alpinen Raum, oft in Reallaboren. Der naheliegendste akademische Partner im Kanton selbst."},{"name":"ibW Höhere Fachschule Südostschweiz","gruppe":"Extern – Graubünden & Region","extern":true,"beschreibung":"Berufs- und Weiterbildung im Bau- und Technikbereich. Der direkte Zugang zu Lernenden und zu Betrieben, die keine Forschungsabteilung haben."},{"name":"Kantonale Denkmalpflege GR","gruppe":"Extern – Graubünden & Region","extern":true,"beschreibung":"Fachstelle für das Baukulturerbe des Kantons und natürlicher Partner für alle Heritage-Themen – vom Scan bis zum Ersatzteil."},{"name":"SLF / WSL Davos","gruppe":"Extern – Graubünden & Region","extern":true,"beschreibung":"Institut für Schnee- und Lawinenforschung. Naturgefahren, Monitoring und Simulation, bereits im Kanton verankert und mit eigenem Publikum."},{"name":"Bündner Gewerbeverband","gruppe":"Extern – Graubünden & Region","extern":true,"beschreibung":"Dachverband des lokalen Gewerbes und Partner von GRdigital. Direkter Zugang zu KMU – und damit zur Zielgruppe, an der sich die Förderung messen lässt."},{"name":"GRdigital Geschäftsstelle","gruppe":"Extern – Graubünden & Region","extern":true,"beschreibung":"Fach- und Koordinationsstelle für die digitale Transformation im Kanton, mit Leistungsauftrag bis 2030 und dem ausdrücklichen Auftrag, den Wissenstransfer zwischen Branchen zu stärken. Erste Adresse für Förderung und Vernetzung."},{"name":"Rhätische Bahn","gruppe":"Extern – Graubünden & Region","extern":true,"beschreibung":"Infrastrukturbetreiberin mit hunderten Kunstbauten in extremer Lage. Monitoring, Zustandserfassung und digitale Zwillinge – und ein Publikum, das ohnehin durch die Täler fährt."},{"name":"Amt für Wald und Naturgefahren GR","gruppe":"Extern – Graubünden & Region","extern":true,"beschreibung":"Zuständig für die Holzressourcen des Kantons und für Gefahrenprävention. Relevant für alles, was mit lokalem Holz oder mit Lawinen- und Steinschlagsimulation zu tun hat."}],"themen":[{"thema":"Scannen Piz Mitgel, Savognin","beschreibung":"Ein dreitägiges Scan-Wochenende im Hotel Piz Mitgel im März 2027. Fachpersonen und Studierende erfassen das Haus zusammen digital. Danach werten Studierende die Daten im Frühjahrssemester 2027 aus. Im Sommer 2027 werden die Ergebnisse im Haus selbst öffentlich gezeigt. Das Hotel Pianta kommt als zweites, kleineres Objekt am letzten Tag dazu.","formattyp":"Anwendungstools aus der Forschung","veranstaltungsformen":["ETH-Exkurs/Ausflug"],"personen":["Benjamin Dillenburger","Desmond Liu","Bharath Seshadri","Wen-Shan Cui","Silke Langenberg","Kasimir Forth","Catherine De Wolf","Bayonle Windapo","Konrad Schindler"],"notiz":"RTC360 3D Scanner von Design++"},{"thema":"MAS ETH","beschreibung":"Gelateria 2.0 Daniela und Benjamin, Holz-Pavilion mit Hollow-Core Shell","formattyp":"Zukunftsmusik","veranstaltungsformen":[],"personen":[],"notiz":"Juni in Mulgens"},{"thema":"Mensch × Maschine","beschreibung":"Aufführung im Zusammenspiel von Mensch und Maschine. Bewegung, Klang, Licht, Material und Raum werden zu Vermittlern zwischen menschlicher Wahrnehmung und maschineller Präzision. Der Roboter ist nicht bloss Werkzeug oder ausführende Maschine, sondern wird zum Gegenüber: Er reagiert, interpretiert, wiederholt, verstärkt oder widerspricht menschlichen Handlungen.\n\nDie Aufführung untersucht damit eine grundlegende Frage unserer zunehmend digitalisierten Umwelt: Wie verändert sich unser Verhältnis zu Technologie, wenn wir ihr nicht nur über Bildschirme und Interfaces begegnen, sondern körperlich, räumlich und sinnlich?","formattyp":"Zukunftsmusik","veranstaltungsformen":["Ausstellung / Installation","Residency (Researcher / Artist in Residence)"],"personen":["Madeline Gannon"],"notiz":"https://atonaton.com/archive\nhttps://atonaton.com/other-natures\nhttps://shorturl.at/9DsAo\nhttps://shorturl.at/FopPt\nhttps://shorturl.at/pyDmt"},{"thema":"(Kunst-)Wettbewerb","beschreibung":"Der Wettbewerb versteht Digitalisierung nicht primär als technologische Entwicklung, sondern als Anlass, bestehende Strukturen, Beziehungen und Möglichkeiten neu zu denken.\n\nGesucht werden Konzepte, die untersuchen, wie digitale Technologien neue Zugänge zum Raum, zur Kultur und zum gesellschaftlichen Leben in Graubünden eröffnen können und dies in Beziehung zu einander stellt.","formattyp":"Anwendungstools aus der Forschung","veranstaltungsformen":["Studierendenwettbewerb","Ausstellung / Installation"],"personen":[],"notiz":""},{"thema":"Tor Alva – ein Turm als Datensatz","beschreibung":"Rückblick auf den Weissen Turm in Mulegns: vom parametrischen Modell über die Fabrikation bis zur Montage im Tal. Was hat funktioniert, was war teurer als gedacht, was ist übertragbar?","formattyp":"Reflexion auf Gebautes","veranstaltungsformen":["Vortrag","Führungen"],"personen":["Benjamin Dillenburger","Michael Hansmeyer","Zindel United","Matthias Leschok","Ana Anton","Jürg Conzett"],"notiz":"https://ethz.ch/en/news-and-events/eth-news/news/2025/05/from-confectioners-to-robots-tor-alva-in-mulegns-is-unveiled.html"},{"thema":"Beton ohne Schalung","beschreibung":"3D-Betondruck ehrlich bilanziert: Stand der Technik, Kosten, Normen. Für welche Bauteile lohnt sich das heute schon in einem kleinen Bündner Baubetrieb?","formattyp":"Anwendungstools aus der Forschung","veranstaltungsformen":["Workshop (Hands-on)","Fachgespräch"],"personen":["Andrei Jipa","Ana Anton","Zindel United","Holcim Innovation Center"],"notiz":""},{"thema":"Gedruckte Dämmung aus Reststoffen","beschreibung":"Mineralschaum-3D-Druck (Airlements) aus recycelten Industrieabfällen: monolithische, dämmende Wandsysteme ohne Verbundaufbau – gebaut für alpine Temperaturunterschiede.","formattyp":"Anwendungstools aus der Forschung","veranstaltungsformen":["Vortrag","Open LAB / Tag der offenen Werkstatt"],"personen":["Patrick Bedarf","FenX AG","Empa / NEST"],"notiz":"https://dbt.arch.ethz.ch/project/airlements/"},{"thema":"Punktwolke, Splat, Denkmal","beschreibung":"Photogrammetrie, LiDAR und 3D Gaussian Splatting als Werkzeuge der Bauaufnahme. Von der Drohne zum überprüfbaren Bestandsmodell – an einem Tag erklärt und einmal selbst gemacht.","formattyp":"Anwendungstools aus der Forschung","veranstaltungsformen":["Workshop (Hands-on)","ETH-Exkurs/Ausflug","Vortrag"],"personen":["Bharath Seshadri","Konrad Schindler","Wen-Shan Cui","Desmond Liu"],"notiz":"https://ethz.ch/en/news-and-events/eth-news/news/2025/11/ai-and-extended-reality-help-to-preserve-built-cultural-heritage.html"},{"thema":"Digitales Konstruktionsarchiv Graubünden","beschreibung":"Wie dokumentiert man digital geplante und gedruckte Bauwerke so, dass sie in 50 Jahren noch reparierbar sind? Aufbau eines offenen Bauteil- und Fabrikationsarchivs, ausgehend von der Sammlung der Stiftung.","formattyp":"Zukunftsmusik","veranstaltungsformen":["Symposium/Research-Tagung"],"personen":["Silke Langenberg","Dominik Reisach","Wen-Shan Cui","Benjamin Dillenburger","Ana Anton"],"notiz":""},{"thema":"Bauteiljäger – KI-gestützte Wiederverwendung","beschreibung":"Reality Capture plus Bildklassifikation, um Bauteile aus Umbau- oder Abbruchobjekten zu erfassen, zu bewerten und digital handelbar zu machen. Materialpässe für den Bündner Bestand.","formattyp":"Anwendungstools aus der Forschung","veranstaltungsformen":["Workshop (Hands-on)","Matchmaking-Apéro mit KMU"],"personen":["Catherine De Wolf","Kasimir Forth","Clara Blum","Vanessa Costalonga Martins","Mikhael Johanes","Vanessa Schwarzkopf","Bayonle Windapo"],"notiz":"https://www.sciencedirect.com/science/article/pii/S0921344923002768?via%3Dihub"},{"thema":"Trockenmauer trifft Roboter","beschreibung":"Der Bündner Trockenmauerbau als Testfall für Computer Vision: unregelmässige Natursteine scannen, algorithmisch sortieren und roboterunterstützt versetzen – ohne das Handwerk zu ersetzen.","formattyp":"Zukunftsmusik","veranstaltungsformen":["ETH-Seminarwoche","ETH-Exkurs/Ausflug","Sommerakademie / Summer School"],"personen":["Fabio Gramazio","Matthias Kohler","Maria Smigielska","Zain Karsan","Martin Bechthold","Vasiliki Kirtsou"],"notiz":""},{"thema":"Bündner Holz, digital sortiert","beschreibung":"Vom Stamm zum Bauteil: krummes, lokales Rundholz scannen und algorithmisch Tragwerkselementen zuordnen. Weniger Verschnitt, mehr Wertschöpfung im Tal.","formattyp":"Anwendungstools aus der Forschung","veranstaltungsformen":["Workshop (Hands-on)","Baustellen-Exkursion / Wanderformat"],"personen":["Ramon Weber","Gonzalo Casas","Johan Wijesinghe","Amt für Wald und Naturgefahren GR","Eric Gozzi"],"notiz":""},{"thema":"Diskrete Architektur – Bauen mit Teilen von der Stange","beschreibung":"Statt jedes Bauteil einzigartig: wenige, identische, robotisch fügbare Holzbausteine aus Plattenmaterial. Reversibel, reparierbar, skalierbar – und für kleine Werkstätten produzierbar.","formattyp":"Zukunftsmusik","veranstaltungsformen":["ETH-Seminarwoche","Studierendenwettbewerb"],"personen":["Gilles Retsin","Johan Wijesinghe","Maria Smigielska","Zindel United","Eric Gozzi"],"notiz":"https://auar.io/"},{"thema":"Wohnraum in grossen Stückzahlen","beschreibung":"Computational Design für seriellen Holzbau: Wie entwirft man tausend Wohnungen, ohne tausendmal von vorn anzufangen? Übertragen auf die Frage nach bezahlbarem, ""},{"thema":"Material, das man ausrechnen kann","beschreibung":"Computational Fabrication: Erscheinungsbild, Steifigkeit und Haptik als optimierbare Grössen. Vom Simulationsmodell zum gedruckten Muster.","formattyp":"Anwendungstools aus der Forschung","veranstaltungsformen":["ETH-Exkurs/Ausflug","Workshop (Hands-on)"],"personen":["Bernd Bickel","Desmond Liu","Anna Maria Eggler","Rafael Bischof"],"notiz":""},{"thema":"Erde, Pilz, Algorithmus","beschreibung":"Biobasierte und lehmbasierte Materialien im robotischen Druck: reversibel, lokal, kompostierbar. Was passiert mit einem Bauteil, das man wieder auflösen kann?","formattyp":"Zukunftsmusik","veranstaltungsformen":["Workshop (Hands-on)","Ausstellung / Installation"],"personen":["Tiziano Derme","Karen A. Antorveza Páez"],"notiz":""},{"thema":"Bühne als Prototyp","beschreibung":"Digitale Fabrikation für Szenografie: Bühnenbilder sind schnelle, risikoarme Testfälle für Bautechnologie. (2019 in den Gärten der Villa Carisch)","formattyp":"Reflexion auf Gebautes","veranstaltungsformen":["Residency (Researcher / Artist in Residence)","Ausstellung / Installation"],"personen":["Benjamin Dillenburger","Matthias Leschok","Angela Yoo"],"notiz":""},{"thema":"Gedruckte Hüllen und Fassaden","beschreibung":"Polymerdruck für dünne, lichtdurchlässige Bauteile – von der Bühne ins Gebäude. Was hält, was altert, was leuchtet?","formattyp":"Anwendungstools aus der Forschung","veranstaltungsformen":["Vortrag","Ausstellung / Installation"],"personen":["Matthias Leschok","Angela Yoo"],"notiz":"https://saeki.ai/"},{"thema":"Der Ort als Modell","beschreibung":"Digitale Zwillinge für Dörfer im Wandel: Mulegns, Riom und die Frage, wie man Leerstand, Nutzung, Energie und Klima gemeinsam simuliert – und wer die Daten besitzt.","formattyp":"Zukunftsmusik","veranstaltungsformen":["Symposium/Research-Tagung","Bürger*innen-Werkstatt"],"personen":["Christian Schmid","Vanessa Schwarzkopf","Fachhochschule Graubünden","Dominik Reisach"],"notiz":""},{"th <script>
/* Unveränderte Kopie der eigenen Datei – vor dem ersten Zeichnen festgehalten,
   damit sich die Seite später mit neuen Daten selbst neu schreiben kann. */
let SELF = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const SEED = JSON.parse(document.getElementById('seed').textContent);
let D = JSON.parse(JSON.stringify(SEED));
let edit = false, tab = 'themen';
let f = {typ:'', form:'', person:'', gruppe:'', netz:'alle', q:''};

const TABS = [
 ['themen','Themen',()=>D.themen.length],
 ['personen','Personen',()=>D.personen.length],
 ['formen','Veranstaltungsformen',()=>D.veranstaltungsformen.length],
 ['teilnehmende','Teilnehmende',()=>D.teilnehmende.length],
 ['typen','Formate',()=>D.formattypen.length],
 ['programm','Programm',()=>D.programm.length||''],
 ['kalender','Kalender',()=>D.programm.filter(p=>p.datum).length+D.termine.filter(t=>t.datum).length||''],
 ['gesamt','Gesamt',()=>''],
];
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jsArg = value => esc(JSON.stringify(String(value??'')));

/* Plain text stays in the data; only display text becomes a safe hyperlink. */
function linkText(value){
  const text=String(value??'');
  const pattern=/\b(?:https?:\/\/|www\.)[^\s<>"']+/gi;
  let out='',last=0;
  for(const match of text.matchAll(pattern)){
    let url=match[0];
    while(/[.,;:!?]$/.test(url)) url=url.slice(0,-1);
    for(const [open,close] of [['(',')'],['[',']'],['{','}']]){
      while(url.endsWith(close)&&url.split(close).length>url.split(open).length) url=url.slice(0,-1);
    }
    out+=esc(text.slice(last,match.index));
    const href=/^www\./i.test(url)?'https://'+url:url;
    out+=`<a class="text-url" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`;
    last=match.index+url.length;
  }
  return out+esc(text.slice(last));
}
const linkPreview=value=>(linkText(value).match(/<a class="text-url"[\s\S]*?<\/a>/g)||[]).join('<br>');
const editableText=value=>edit?esc(value):linkText(value);
function refreshLinks(input){
  const preview=input.nextElementSibling;
  if(preview?.classList.contains('url-preview')) preview.innerHTML=linkPreview(input.value);
}

const P = n => D.personen.find(p=>p.name===n);
const isX = n => { const p=P(n); return p?!!p.extern:false; };
const norm = s => String(s??'').toLowerCase();
const topicsOf = n => D.themen.filter(t=>t.personen.includes(n));
const topicsFmt = v => D.themen.filter(t=>t.veranstaltungsformen.includes(v));
const $ = id => document.getElementById(id);
const slug = s => 'k'+String(s).replace(/[^a-zA-Z0-9]/g,'_');

/* chip builders — Formen und Personen sehen bewusst unterschiedlich aus */
const fmtChip = v => `<span class="fmt" onclick="goForm(${jsArg(v)})">${esc(v)}</span>`;
const perChip = n => `<span class="per ${isX(n)?'ext':''}" onclick="goPerson(${jsArg(n)})">${esc(n)}${
  isX(n)?'<span class="e">extern</span>':''}</span>`;

function renderTabs(){
  $('tabs').innerHTML = TABS.map(([id,l,c])=>{const n=c();
    return `<button class="${tab===id?'on':''}" onclick="go('${id}')">${l}${
      n!==''?`<span class="n">${n}</span>`:''}</button>`}).join('');
}
function go(id){tab=id;render();window.scrollTo({top:0})}
function render(){
  D.termine ||= [];   /* ältere Dateien kennen noch keine weiteren Termine */
  renderTabs();
  document.querySelectorAll('section').forEach(s=>s.classList.remove('on'));
  $('t-'+tab).classList.add('on');
  ({themen:rThemen,personen:rPersonen,formen:rFormen,teilnehmende:rTeil,
    typen:rTypen,programm:rProgramm,kalender:rKalender,gesamt:rGesamt})[tab]();
  updateStatus();
}
const editBtn = extra => `<div class="bar">
  <button class="${edit?'on':''}" onclick="edit=!edit;render()">${edit?'Bearbeiten aus':'Bearbeiten'}</button>
  ${extra}</div>`;
const ce = path => edit ? `contenteditable="true" onblur="setVal('${path}',this.innerText)"` : '';
function setVal(path,val){
  const k=path.split('.'); let o=D;
  for(let i=0;i<k.length-1;i++) o=o[/^\d+$/.test(k[i])?+k[i]:k[i]];
  o[k.at(-1)]=val.trim(); markDirty(); renderTabs();
}
function flash(sel){
  const el=document.querySelector(sel); if(!el) return;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  if(el.tagName==='DETAILS') el.open=true;
  el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1800);
}
function clearQ(){f.q='';$('q').value=''}
function goPerson(n){f.gruppe='';f.netz='alle';clearQ();go('personen');
  setTimeout(()=>flash('#'+slug(n)),40)}
function goTopic(n){f.typ=f.form=f.person='';clearQ();go('themen');
  setTimeout(()=>flash('#'+slug(n)),40)}
function goForm(n){clearQ();go('formen');setTimeout(()=>flash('#'+slug(n)),40)}
function goTyp(n){clearQ();go('typen');setTimeout(()=>flash('#'+slug(n)),40)}

/* ---------------------------------------------------------------- Themen */
/* --- Formular für neues / bestehendes Thema --- */
let editing=null, draft=null, pfilter='';
function openForm(i){
  draft = i===-1
    ? {thema:'',beschreibung:'',formattyp:D.formattypen[0].name,veranstaltungsformen:[],personen:[],notiz:''}
    : JSON.parse(JSON.stringify(D.themen[i]));
  editing=i; pfilter=''; render();
  setTimeout(()=>{const el=$('fThema'); if(el){el.focus();
    el.scrollIntoView({behavior:'smooth',block:'center'})}},40);
}
function syncDraft(){
  if(!draft) return;
  if($('fThema')) draft.thema=$('fThema').value;
  if($('fBesch')) draft.beschreibung=$('fBesch').value;
  if($('fNotiz')) draft.notiz=$('fNotiz').value;
  if($('fTyp'))   draft.formattyp=$('fTyp').value;
}
function togDraft(key,val){
  syncDraft();
  const a=draft[key], j=a.indexOf(val); j>=0?a.splice(j,1):a.push(val);
  $('themenform').innerHTML=formHTML();
}
function setPfilter(v){syncDraft();pfilter=norm(v);$('themenform').innerHTML=formHTML();
  setTimeout(()=>{const el=$('fPf');if(el){el.focus();el.setSelectionRange(99,99)}},0)}
function saveDraft(){
  syncDraft();
  if(!draft.thema.trim()){alert('Bitte einen Titel eingeben.');return}
  const title=draft.thema;
  if(editing===-1) D.themen.unshift(draft); else D.themen[editing]=draft;
  editing=null;draft=null;markDirty();render();
  setTimeout(()=>flash('#'+slug(title)),40);
}
function formHTML(){
  const d=draft;
  const chosen=(arr,key,cls)=>arr.length
    ? arr.map(v=>`<span class="${cls}" onclick="togDraft('${key}',${jsArg(v)})"
        title="entfernen">${esc(v)}</span>`).join('')
    : '<span class="rt">noch nichts gewählt</span>';
  const gs=[...new Set(D.personen.map(p=>p.gruppe))];
  return `<div class="form">
   <h3>${editing===-1?'Neues Thema':'Thema bearbeiten'}</h3>
   <div class="frow"><label>Thema</label>
     <input type="text" id="fThema" value="${esc(d.thema)}" placeholder="Titel der Veranstaltung"></div>
   <div class="frow"><label>Beschreibung</label>
     <textarea id="fBesch" placeholder="Worum geht es?" oninput="refreshLinks(this)">${esc(d.beschreibung)}</textarea><div class="url-preview">${linkPreview(d.beschreibung)}</div></div>
   <div class="frow"><label for="fNotiz">Notizen</label><textarea id="fNotiz" oninput="refreshLinks(this)">${esc(d.notiz)}</textarea><div class="url-preview">${linkPreview(d.notiz)}</div></div>
   <div class="frow"><label>Format</label>

function renamePerson(i,value){
  const person=D.personen[i];
  if(!person) return;
  const name=value.trim(), old=person.name;
  if(name===old) return;
  if(!name){alert('Bitte einen Namen eingeben.');return false}
  if(D.personen.some((p,j)=>j!==i&&norm(p.name.trim())===norm(name))){
    alert('Dieser Name ist bereits vorhanden. Bitte einen eindeutigen Namen verwenden.');return false;
  }
  person.name=name;
  const replace=names=>names.map(n=>n===old?name:n);
  D.themen.forEach(t=>t.personen=replace(t.personen));
  D.programm.forEach(p=>p.personen=replace(p.personen));
  if(draft) draft.personen=replace(draft.personen);
  if(f.person===old) f.person=name;
  markDirty();
  return true;
}

function movePersonEntry(kind,from,to,after=false){
  const gs=[...new Set(D.personen.map(p=>p.gruppe))];
  if(from===to) return;
  if(kind==='group'){
    const source=gs[from], target=gs[to];
    if(source===undefined||target===undefined) return;
    gs.splice(from,1); gs.splice(gs.indexOf(target)+(after?1:0),0,source);
    D.personen=gs.flatMap(g=>D.personen.filter(p=>p.gruppe===g));
  }else{
    const source=D.personen[from],target=D.personen[to];
    if(!source||!target||source.gruppe!==target.gruppe) return;
    D.personen.splice(from,1);
    D.personen.splice(D.personen.indexOf(target)+(after?1:0),0,source);
  }
  markDirty();render();
}
function bindPersonDrag(){
  const root=$('t-personen'); let drag=null;
  const clear=()=>root.querySelectorAll('.drop-before,.drop-after,.dragging').forEach(el=>el.classList.remove('drop-before','drop-after','dragging'));
  root.querySelectorAll('[data-drag]').forEach(handle=>{
    handle.onclick=e=>{e.stopPropagation();e.preventDefault()};
    handle.onkeydown=e=>{
      if(!['ArrowUp','ArrowDown'].includes(e.key)) return;
      e.preventDefault();const kind=handle.dataset.drag,from=+handle.dataset.index,down=e.key==='ArrowDown';
      const source=D.personen[from];
      const indices=kind==='group'?[...new Set(D.personen.map(p=>p.gruppe))].map((_,i)=>i):D.personen.map((p,i)=>p.gruppe===source.gruppe?i:-1).filter(i=>i>=0);
      const to=indices[indices.indexOf(from)+(down?1:-1)];
      if(to===undefined)return;
      movePersonEntry(kind,from,to,down);
      root.querySelector(`[data-drag="${kind}"][data-index="${to}"]`)?.focus();
    };
    handle.ondragstart=e=>{
      drag={kind:handle.dataset.drag,index:+handle.dataset.index};
      e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',JSON.stringify(drag));
      handle.closest(drag.kind==='group'?'.person-group':'details.item').classList.add('dragging');
      e.stopPropagation();
    };
    handle.ondragend=()=>{drag=null;clear()};
  });
  root.ondragover=e=>{
    if(!drag)return;
    const target=e.target.closest(drag.kind==='group'?'.person-group':'[data-person]');
    clear();if(!target)return;
    const to=+(drag.kind==='group'?target.dataset.group:target.dataset.person);
    if(to===drag.index||(drag.kind==='person'&&D.personen[to].gruppe!==D.personen[drag.index].gruppe))return;
    e.preventDefault();e.dataTransfer.dropEffect='move';
    const rect=target.getBoundingClientRect();
    target.classList.add(e.clientY>rect.top+rect.height/2?'drop-after':'drop-before');
  };
  root.ondrop=e=>{
    if(!drag)return;
    const target=root.querySelector('.drop-before,.drop-after');if(!target)return;
    e.preventDefault();const to=+(drag.kind==='group'?target.dataset.group:target.dataset.person);
    const after=target.classList.contains('drop-after');
    movePersonEntry(drag.kind,drag.index,to,after);drag=null;
  };
}

        onclick="D.programm[${i}].personen=D.programm[${i}].personen.filter(x=>x!==${jsArg(n)});markDirty();render()"

      <details><summary class="more">Zielgruppen wählen</summary>
        <div class="picker">${D.teilnehmende.map(z=>`<label><input type="checkbox" ${

     </div></div>`}).join('');
}
function pickerHTML(i){

        onchange="tog(${i},'personen',${jsArg(p.name)})"> ${esc(p.name)}</label>`).join('')).join('');
